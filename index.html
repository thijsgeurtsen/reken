<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekenen – Start</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:system-ui,sans-serif;
      background:#f4f6ff;
    }

    .box{
      width:min(95%,680px);
      background:white;
      padding:3rem 2.5rem;
      border-radius:2rem;
      box-shadow:0 12px 40px rgba(0,0,0,.08);
      text-align:center;
    }

    h1{
      margin:0 0 .5rem;
      font-size:2.7rem;
    }

    .sub{
      margin:0 0 1.8rem;
      color:#444;
      font-size:1.15rem;
    }

    select,
    input{
      display:block;
      width:100%;
      font-size:1.15rem;
      padding:1rem 1.1rem;
      margin:.9rem 0;
      border:2px solid #d8dcff;
      border-radius:1rem;
      background:white;
      outline:none;
    }

    select:focus,
    input:focus{
      border-color:#4f46e5;
      box-shadow:0 0 0 3px rgba(79,70,229,.15);
    }

    select:disabled,
    input:disabled{
      color:#999;
      background:#fafafa;
    }

    button{
      margin-top:.7rem;
      padding:.9rem 2rem;
      min-width:170px;
      border:none;
      border-radius:999px;
      background:#4f46e5;
      color:white;
      font-size:1.1rem;
      font-weight:900;
      cursor:pointer;
    }

    button:disabled{
      background:#bbb;
      cursor:default;
    }

    .status{
      margin-top:1rem;
      min-height:1.5rem;
      color:#555;
    }

    .error{
      color:#dc2626;
      font-weight:700;
    }

    .good{
      color:#15803d;
      font-weight:700;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Start</h1>

  <p class="sub">
    Kies je klas en log in met je naam en code
  </p>


  <select id="classSelect">
    <option value="">Kies je klas</option>

    <option value="LianneLaura">LianneLaura</option>
    <option value="MetteJur">MetteJur</option>
    <option value="Jochem">Jochem</option>
    <option value="JaraMette">JaraMette</option>
    <option value="NatashaAnoek">NatashaAnoek</option>
    <option value="SanneSander">SanneSander</option>
    <option value="AnoekThijs">AnoekThijs</option>
    <option value="Adne">Adne</option>
    <option value="Stefan">Stefan</option>
    <option value="KarinMirjam">KarinMirjam</option>
    <option value="FionaMieke">FionaMieke</option>
    <option value="Mike">Mike</option>
    <option value="SandraJoris">SandraJoris</option>
  </select>


  <select id="studentSelect" disabled>
    <option value="">Kies eerst je klas</option>
  </select>


  <input
    id="codeInput"
    type="password"
    placeholder="Jouw code"
    autocomplete="off"
  >


  <button id="loginBtn" disabled>
    Inloggen
  </button>


  <div id="status" class="status"></div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbz-13F67vdmwulyOw5QVfO9AW25louOoFU6on6MlBvbSzxjzjuR8mbEwfTHzSZaSCeyvQ/exec";


/* =========================================================
   OPSLAG
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";


/* =========================================================
   ELEMENTEN
========================================================= */

const classSelect =
  document.getElementById("classSelect");

const studentSelect =
  document.getElementById("studentSelect");

const codeInput =
  document.getElementById("codeInput");

const loginBtn =
  document.getElementById("loginBtn");

const statusEl =
  document.getElementById("status");


/* =========================================================
   JSONP
========================================================= */

let jsonpCounter = 0;


function jsonp(
  url,
  timeoutMs = 8000
) {

  return new Promise(
    (resolve,reject) => {

      const callback =
        "__reken_cb_"
        + (++jsonpCounter)
        + "_"
        + Date.now();


      const script =
        document.createElement("script");


      let klaar =
        false;


      const cleanup =
        () => {

          try {
            delete window[callback];
          } catch(e) {}

          script.remove();
        };


      const timer =
        setTimeout(
          () => {

            if (klaar) {
              return;
            }

            klaar =
              true;

            cleanup();

            reject(
              new Error("timeout")
            );

          },
          timeoutMs
        );


      window[callback] =
        data => {

          if (klaar) {
            return;
          }

          klaar =
            true;

          clearTimeout(timer);

          cleanup();

          resolve(data);
        };


      script.onerror =
        () => {

          if (klaar) {
            return;
          }

          klaar =
            true;

          clearTimeout(timer);

          cleanup();

          reject(
            new Error("JSONP failed")
          );
        };


      const sep =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url
        + sep
        + "callback="
        + encodeURIComponent(callback)
        + "&_="
        + Date.now();


      document.body.appendChild(
        script
      );
    }
  );
}


/* =========================================================
   LEERLINGEN OPHALEN
========================================================= */

async function getStudents(
  klas
) {

  const url =
    `${SHEETS_EXEC_URL}?action=students`
    + `&klas=${encodeURIComponent(klas)}`;


  try {

    return await jsonp(
      url,
      8000
    );

  } catch(e) {

    /*
      Eén keer opnieuw proberen.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          600
        )
    );


    return await jsonp(
      url,
      10000
    );
  }
}


/* =========================================================
   LOGIN
========================================================= */

async function loginStudent(
  klas,
  naam,
  code
) {

  const url =
    `${SHEETS_EXEC_URL}?action=login`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`;


  return await jsonp(
    url,
    10000
  );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  tekst,
  soort = ""
) {

  statusEl.textContent =
    tekst;

  statusEl.className =
    "status"
    + (
        soort
          ? " " + soort
          : ""
      );
}


/* =========================================================
   LOGIN-KNOP
========================================================= */

function updateLoginButton() {

  loginBtn.disabled =
    !classSelect.value
    ||
    !studentSelect.value
    ||
    !codeInput.value.trim();
}


studentSelect.addEventListener(
  "change",
  updateLoginButton
);


codeInput.addEventListener(
  "input",
  updateLoginButton
);


/* =========================================================
   KLAS KIEZEN
========================================================= */

let naamLaadNummer =
  0;


classSelect.addEventListener(
  "change",
  async () => {

    const klas =
      classSelect.value;


    const mijnNummer =
      ++naamLaadNummer;


    studentSelect.disabled =
      true;

    studentSelect.innerHTML =
      `<option value="">Namen laden…</option>`;

    loginBtn.disabled =
      true;


    setStatus("");


    if (!klas) {

      studentSelect.innerHTML =
        `<option value="">Kies eerst je klas</option>`;

      return;
    }


    try {

      const res =
        await getStudents(
          klas
        );


      /*
        Als inmiddels een andere klas is gekozen:
        deze reactie negeren.
      */

      if (
        mijnNummer !==
        naamLaadNummer
      ) {

        return;
      }


      if (
        !res
        ||
        res.ok !== true
        ||
        !Array.isArray(
          res.students
        )
      ) {

        throw new Error(
          "Ongeldig antwoord"
        );
      }


      studentSelect.innerHTML =
        `<option value="">Kies je naam</option>`;


      for (
        const naam of res.students
      ) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          naam;

        option.textContent =
          naam;


        studentSelect.appendChild(
          option
        );
      }


      studentSelect.disabled =
        false;


      setStatus(
        "Namen geladen.",
        "good"
      );


    } catch(e) {

      if (
        mijnNummer !==
        naamLaadNummer
      ) {

        return;
      }


      studentSelect.innerHTML =
        `<option value="">Laden mislukt</option>`;


      studentSelect.disabled =
        true;


      setStatus(
        "Namen laden lukte niet. Kies de klas opnieuw om nogmaals te proberen.",
        "error"
      );
    }
  }
);


/* =========================================================
   INLOGGEN
========================================================= */

loginBtn.addEventListener(
  "click",
  async () => {

    const klas =
      classSelect.value;

    const naam =
      studentSelect.value;

    const code =
      codeInput.value.trim();


    if (
      !klas ||
      !naam ||
      !code
    ) {

      return;
    }


    loginBtn.disabled =
      true;

    classSelect.disabled =
      true;

    studentSelect.disabled =
      true;

    codeInput.disabled =
      true;


    setStatus(
      "Inloggen…"
    );


    try {

      const res =
        await loginStudent(
          klas,
          naam,
          code
        );


      if (
        !res ||
        res.ok !== true
      ) {

        throw new Error(
          res?.error ||
          "Inloggen mislukt"
        );
      }


      localStorage.setItem(
        STORAGE_CURRENT,
        naam
      );


      localStorage.setItem(
        STORAGE_CLASS,
        klas
      );


      localStorage.setItem(
        STORAGE_CODE,
        code
      );


      location.href =
        "menu.html";


    } catch(e) {

      setStatus(
        "Naam of code klopt niet.",
        "error"
      );


      classSelect.disabled =
        false;

      studentSelect.disabled =
        false;

      codeInput.disabled =
        false;


      updateLoginButton();
    }
  }
);


/* =========================================================
   ENTER BIJ CODE
========================================================= */

codeInput.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
      &&
      !loginBtn.disabled
    ) {

      loginBtn.click();
    }
  }
);

</script>

</body>
</html>
