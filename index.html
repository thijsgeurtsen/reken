<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Start – Rekenen</title>

  <style>
    body{
      font-family:system-ui,sans-serif;
      background:#f4f6ff;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }

    .box{
      background:#fff;
      padding:2.2rem;
      border-radius:1.8rem;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      max-width:560px;
      width:100%;
      text-align:center;
    }

    h1{
      margin:0 0 .4rem;
      font-size:2.2rem;
    }

    .sub{
      margin:0 0 1.4rem;
      color:#555;
      font-size:1.05rem;
    }

    select,
    input{
      width:100%;
      font-size:1.1rem;
      padding:1rem 1.1rem;
      border-radius:1.1rem;
      border:2px solid #cfd3ff;
      outline:none;
      background:#fff;
      box-sizing:border-box;
      margin-bottom:.9rem;
    }

    select:focus,
    input:focus{
      border-color:#4f46e5;
      box-shadow:0 0 0 4px rgba(79,70,229,.15);
    }

    button{
      margin-top:.4rem;
      padding:1rem 1.4rem;
      border:none;
      border-radius:999px;
      background:#4f46e5;
      color:#fff;
      font-weight:900;
      font-size:1rem;
      cursor:pointer;
      min-width:160px;
    }

    button:disabled{
      background:#b9b9c7;
      cursor:default;
    }

    .status{
      margin-top:.9rem;
      color:#555;
      font-size:.95rem;
      min-height:1.4rem;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Start</h1>

    <p class="sub">
      Kies je klas en log in met je naam en code
    </p>


    <select id="classSelect">

      <option value="">
        Kies je klas
      </option>

      <option value="LianneLaura">
        LianneLaura
      </option>

      <option value="MetteJur">
        MetteJur
      </option>

      <option value="Jochem">
        Jochem
      </option>

      <option value="JaraMette">
        JaraMette
      </option>

      <option value="NatashaAnoek">
        NatashaAnoek
      </option>

      <option value="SanneSander">
        SanneSander
      </option>

      <option value="AnoekThijs">
        AnoekThijs
      </option>

      <option value="Adne">
        Adne
      </option>

      <option value="Stefan">
        Stefan
      </option>

      <option value="KarinMirjam">
        KarinMirjam
      </option>

      <option value="FionaMieke">
        FionaMieke
      </option>

      <option value="Mike">
        Mike
      </option>

      <option value="SandraJoris">
        SandraJoris
      </option>

    </select>


    <select
      id="studentName"
      disabled
    >

      <option value="">
        Kies eerst je klas
      </option>

    </select>


    <input
      id="studentCode"
      type="password"
      placeholder="Jouw code"
      autocomplete="current-password"
      autocapitalize="none"
      spellcheck="false"
    />


    <button
      id="loginBtn"
      type="button"
    >
      Inloggen
    </button>


    <div
      class="status"
      id="statusMsg"
    >
      Nog niet ingelogd.
    </div>

  </div>


<script>

/* =========================================================
   A) GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbwDqfW2yLkL2dX_ucTkz3ZxlHIsOAoZXocJCwpiJGZks77KqoxdvDK2BS6ox9GeCgGpEQ/exec";


/* =========================================================
   B) LOCAL STORAGE
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";


/* =========================================================
   C) SCHERMELEMENTEN
========================================================= */

const classSelect =
  document.getElementById("classSelect");

const studentName =
  document.getElementById("studentName");

const studentCode =
  document.getElementById("studentCode");

const loginBtn =
  document.getElementById("loginBtn");

const statusMsg =
  document.getElementById("statusMsg");


/* =========================================================
   D) JSONP
========================================================= */

let __jsonpSeq = 0;


/*
  Na 8 seconden stoppen we met wachten.

  Dat voorkomt dat de pagina eindeloos op
  "Namen laden..." blijft staan.
*/
function jsonp(url, timeoutMs = 8000) {

  return new Promise((resolve, reject) => {

    const cb =
      "__cb_"
      + (++__jsonpSeq)
      + "_"
      + Date.now();


    const script =
      document.createElement("script");


    let finished = false;


    const cleanup = () => {

      if (finished) {
        return;
      }

      finished = true;


      clearTimeout(timeout);


      try {
        delete window[cb];
      } catch(e) {}


      if (script.parentNode) {
        script.remove();
      }

    };


    window[cb] = (data) => {

      if (finished) {
        return;
      }


      cleanup();

      resolve(data);

    };


    script.onerror = () => {

      if (finished) {
        return;
      }


      cleanup();

      reject(
        new Error("Verbinding mislukt")
      );

    };


    const timeout =
      setTimeout(() => {

        if (finished) {
          return;
        }


        cleanup();

        reject(
          new Error("Timeout")
        );

      }, timeoutMs);


    const sep =
      url.includes("?")
        ? "&"
        : "?";


    /*
      Tijdstempel voorkomt ongewenste browser-cache.
    */
    script.src =
      url
      + sep
      + "callback="
      + encodeURIComponent(cb)
      + "&_="
      + Date.now();


    document.body.appendChild(script);

  });

}


/* =========================================================
   E) AUTOMATISCH OPNIEUW PROBEREN
========================================================= */

async function jsonpMetRetry(url) {

  try {

    /*
      Eerste poging.
    */
    return await jsonp(
      url,
      8000
    );


  } catch (eersteFout) {

    /*
      Google kan soms even wakker moeten worden.

      Kleine pauze en daarna automatisch
      nog één poging.
    */

    await new Promise(
      resolve =>
        setTimeout(resolve, 600)
    );


    return await jsonp(
      url,
      10000
    );

  }

}


/* =========================================================
   F) NAMEN LADEN
========================================================= */

/*
  Hiermee voorkomen we dat een oude aanvraag
  later een nieuw gekozen klas overschrijft.
*/
let naamLaadNummer = 0;


async function laadNamen(klas) {

  const mijnLaadNummer =
    ++naamLaadNummer;


  studentName.disabled =
    true;


  studentName.innerHTML =
    '<option value="">Namen laden...</option>';


  studentCode.value =
    "";


  statusMsg.textContent =
    "Namen laden…";


  const url =
    `${SHEETS_EXEC_URL}?action=students`
    + `&klas=${encodeURIComponent(klas)}`;


  try {

    const res =
      await jsonpMetRetry(url);


    /*
      Heeft de leerling ondertussen een andere
      klas gekozen?

      Dan negeren we deze oude reactie.
    */
    if (
      mijnLaadNummer !== naamLaadNummer
    ) {
      return;
    }


    if (
      classSelect.value.trim() !== klas
    ) {
      return;
    }


    studentName.innerHTML =
      '<option value="">Kies je naam</option>';


    if (
      !res
      ||
      res.ok !== true
      ||
      !Array.isArray(res.students)
    ) {

      studentName.innerHTML =
        '<option value="">Geen namen gevonden</option>';


      statusMsg.textContent =
        "Geen namen gevonden.";


      return;
    }


    /*
      Namen toevoegen.
    */
    res.students.forEach(
      leerling => {

        const naam =
          typeof leerling === "string"
            ? leerling
            : leerling.naam;


        if (!naam) {
          return;
        }


        const option =
          document.createElement("option");


        option.value =
          naam;


        option.textContent =
          naam;


        studentName.appendChild(
          option
        );

      }
    );


    studentName.disabled =
      false;


    statusMsg.textContent =
      `${res.students.length} leerlingen geladen. Kies je naam en vul je code in.`;


  } catch(e) {

    /*
      Alleen fout tonen als deze aanvraag
      nog steeds bij de gekozen klas hoort.
    */
    if (
      mijnLaadNummer !== naamLaadNummer
    ) {
      return;
    }


    studentName.innerHTML =
      '<option value="">Laden mislukt</option>';


    studentName.disabled =
      true;


    statusMsg.textContent =
      "Namen laden lukte niet. Kies de klas opnieuw om nogmaals te proberen.";

  }

}


/* =========================================================
   G) KLAS KIEZEN
========================================================= */

classSelect.addEventListener(
  "change",
  () => {

    const klas =
      classSelect.value.trim();


    /*
      Oude aanvragen ongeldig maken.
    */
    naamLaadNummer++;


    studentName.disabled =
      true;


    studentName.innerHTML =
      '<option value="">Kies eerst je klas</option>';


    studentCode.value =
      "";


    if (klas) {

      laadNamen(
        klas
      );

    } else {

      statusMsg.textContent =
        "Nog niet ingelogd.";

    }

  }
);


/* =========================================================
   H) INLOGGEN BIJ GOOGLE SHEETS
========================================================= */

async function loginStudent(
  klas,
  naam,
  code
) {

  const url =
    `${SHEETS_EXEC_URL}?action=login`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`;


  /*
    Ook bij inloggen één automatische
    tweede poging als Google even traag is.
  */
  return await jsonpMetRetry(
    url
  );

}


/* =========================================================
   I) LOGIN
========================================================= */

async function login() {

  const klas =
    classSelect.value.trim();


  const naam =
    studentName.value.trim();


  const code =
    studentCode.value.trim();


  if (
    !klas
    ||
    !naam
    ||
    !code
  ) {

    statusMsg.textContent =
      "Vul klas, naam en code in.";


    return;
  }


  loginBtn.disabled =
    true;


  classSelect.disabled =
    true;


  studentName.disabled =
    true;


  studentCode.disabled =
    true;


  statusMsg.textContent =
    "Inloggen…";


  try {

    const res =
      await loginStudent(
        klas,
        naam,
        code
      );


    if (
      res
      &&
      res.ok === true
    ) {

      /*
        Leerlinggegevens bewaren.
      */

      localStorage.setItem(
        STORAGE_CLASS,
        klas
      );


      localStorage.setItem(
        STORAGE_CURRENT,
        naam
      );


      localStorage.setItem(
        STORAGE_CODE,
        code
      );


      statusMsg.textContent =
        "Inloggen gelukt ✅";


      location.href =
        "menu.html";


      return;
    }


    /*
      Apps Script kan ook een foutmelding
      teruggeven.
    */
    statusMsg.textContent =
      res?.error
        ? "Naam of code klopt niet."
        : "Inloggen mislukt.";


  } catch(e) {

    statusMsg.textContent =
      "Verbinding met Google lukte niet. Probeer het nog eens.";


  } finally {

    loginBtn.disabled =
      false;


    classSelect.disabled =
      false;


    studentName.disabled =
      false;


    studentCode.disabled =
      false;

  }

}


/* =========================================================
   J) KNOP + ENTER
========================================================= */

loginBtn.addEventListener(
  "click",
  login
);


studentCode.addEventListener(
  "keydown",
  (e) => {

    if (
      e.key === "Enter"
    ) {

      login();

    }

  }
);

</script>

</body>
</html>
