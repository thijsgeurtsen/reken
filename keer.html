<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keersommen</title>

  <style>
    body{
      font-family:system-ui,sans-serif;
      background:#f4f6ff;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      background:#fff;
      padding:2rem 2.4rem;
      border-radius:1.5rem;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
      max-width:820px;
      width:95%;
      text-align:center;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:1rem;
      margin-bottom:1rem;
      flex-wrap:wrap;
    }

    a{
      text-decoration:none;
      font-weight:800;
      color:#4f46e5;
    }

    .pill{
      background:#eef2ff;
      padding:.35rem .7rem;
      border-radius:999px;
      font-weight:900;
    }

    h1{
      margin:.2rem 0 1rem 0;
      font-size:2.2rem;
    }

    .levelbar{
      margin:.2rem auto 1.2rem auto;
      background:#eef2ff;
      padding:.6rem .9rem;
      border-radius:999px;
      font-weight:900;
      max-width:560px;
    }

    .stats{
      font-size:1.1rem;
      margin:.8rem 0 1.4rem 0;
    }

    .q{
      font-size:4rem;
      margin:1.2rem 0;
      min-height:4.2rem;
    }

    #answer{
      font-size:1.8rem;
      padding:.6rem 1rem;
      width:260px;
      text-align:center;
      border-radius:1rem;
      border:2px solid #cfcfe6;
    }

    .feedback{
      height:1.6rem;
      font-weight:900;
      margin-top:.6rem;
    }

    .good{
      color:#16a34a;
    }

    .bad{
      color:#dc2626;
    }

    button{
      margin-top:1.1rem;
      padding:.85rem 1.35rem;
      border:none;
      border-radius:999px;
      background:#4f46e5;
      color:white;
      font-weight:900;
      cursor:pointer;
    }

    button:disabled{
      background:#bbb;
    }

    .smalltxt{
      font-size:.85rem;
      color:#666;
      margin-top:.5rem;
    }

    .result{
      margin-top:1rem;
      font-weight:900;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="top">

    <a href="menu.html">← Menu</a>

    <div>
      <span class="pill" id="who">Leerling: -</span>
      <span class="pill" id="whichClass">Klas: -</span>
    </div>

  </div>


  <h1>Keersommen</h1>


  <div class="levelbar" id="level">
    Niveau: laden…
  </div>


  <div class="smalltxt" id="sheetStatus">
    Sheets: verbinden…
  </div>


  <div class="stats">
    ⏱ <span id="time">2:00</span>
    |
    ✅ <span id="good">0</span>
    |
    📊 <span id="tries">0</span>
  </div>


  <div class="q" id="question">
    Klik op start
  </div>


  <input
    id="answer"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="antwoord"
    disabled
  >


  <div
    class="feedback"
    id="feedback">
  </div>


  <button id="startBtn" disabled>
    Start
  </button>


  <div id="result" class="result"></div>

</div>


<script>

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbz-13F67vdmwulyOw5QVfO9AW25louOoFU6on6MlBvbSzxjzjuR8mbEwfTHzSZaSCeyvQ/exec";


const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";

const STORAGE_DATA_PREFIX =
  "rekenen_data_v3_";


const studentId =
  (localStorage.getItem(STORAGE_CURRENT) || "").trim();

const studentClass =
  (localStorage.getItem(STORAGE_CLASS) || "").trim();

const studentCode =
  (localStorage.getItem(STORAGE_CODE) || "").trim();


if (
  !studentId ||
  !studentClass ||
  !studentCode
) {
  location.href = "index.html";
}


document.getElementById("who").textContent =
  `Leerling: ${studentId}`;

document.getElementById("whichClass").textContent =
  `Klas: ${studentClass}`;


function dataKey() {

  return STORAGE_DATA_PREFIX
    + studentClass
    + "__"
    + studentId;
}


function getLocalData() {

  const raw =
    localStorage.getItem(dataKey());

  return raw
    ? JSON.parse(raw)
    : {
        levels:{
          plus:0,
          min:0,
          keer:0,
          deel:0
        }
      };
}


function setLocalData(d) {

  localStorage.setItem(
    dataKey(),
    JSON.stringify(d)
  );
}


let jsonpSeq = 0;


function jsonp(url) {

  return new Promise((resolve,reject) => {

    const cb =
      "__cb_"
      + (++jsonpSeq)
      + "_"
      + Date.now();

    const script =
      document.createElement("script");

    const cleanup =
      () => {

        try {
          delete window[cb];
        } catch(e) {}

        script.remove();
      };

    window[cb] =
      data => {

        cleanup();
        resolve(data);
      };

    script.onerror =
      () => {

        cleanup();
        reject(
          new Error("JSONP failed")
        );
      };

    const sep =
      url.includes("?")
        ? "&"
        : "?";

    script.src =
      url
      + sep
      + "callback="
      + encodeURIComponent(cb);

    document.body.appendChild(
      script
    );

  });
}


async function sheetsGet(
  klas,
  naam,
  code
) {

  return await jsonp(
    `${SHEETS_EXEC_URL}?action=get`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
  );
}


async function sheetsFinishKeer(
  klas,
  naam,
  code,
  promoted,
  keerLevel
) {

  let url =
    `${SHEETS_EXEC_URL}?action=set`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
    + `&played=1`
    + `&promoted=${promoted ? 1 : 0}`
    + `&game=keer`;


  if (promoted) {

    url +=
      `&keer=${encodeURIComponent(keerLevel)}`;
  }


  return await jsonp(url);
}


const LEVELS = [
  "Tafel van 2",
  "Tafel van 2 en 10",
  "Tafel van 2, 5 en 10",
  "Tafel van 3 en 4",
  "Tafel van 2,3,4,5 en 10",
  "Tafel van 6 en 7",
  "Tafel van 2,3,4,5,6,7 en 10",
  "Tafel van 8 en 9",
  "Alle tafels",
  "Stipsommen met tafels (8 × … = 56)",
  "Grote keersommen (80×9, 800×9, 80×90)"
];


const PROMOTE_AT = 24;
const SECONDS = 120;


const qEl =
  document.getElementById("question");

const aEl =
  document.getElementById("answer");

const fEl =
  document.getElementById("feedback");

const tEl =
  document.getElementById("time");

const goodEl =
  document.getElementById("good");

const triesEl =
  document.getElementById("tries");

const levelEl =
  document.getElementById("level");

const startBtn =
  document.getElementById("startBtn");

const sheetStatusEl =
  document.getElementById("sheetStatus");

const resultEl =
  document.getElementById("result");


let running = false;
let timer = null;
let time = SECONDS;
let good = 0;
let tries = 0;
let correctAnswer = 0;
let sheetsOk = false;


let levels = {
  plus:0,
  min:0,
  keer:0,
  deel:0
};


function clampLevel(lvl) {

  return Math.max(
    0,
    Math.min(
      Number(lvl)||0,
      LEVELS.length-1
    )
  );
}


function getLevelIndex() {

  return clampLevel(
    levels.keer
  );
}


function renderLevel() {

  const lvl =
    getLevelIndex();

  levelEl.textContent =
    "Niveau: " + LEVELS[lvl];
}


function fmtTime() {

  tEl.textContent =
    `${Math.floor(time/60)}:`
    + String(time%60).padStart(2,"0");
}


function setFeedback(
  text,
  ok
) {

  fEl.textContent =
    text;

  fEl.className =
    "feedback "
    + (
        ok
          ? "good"
          : "bad"
      );
}


function clearFeedback() {

  fEl.textContent =
    "";

  fEl.className =
    "feedback";
}


function r(min,max) {

  return Math.floor(
    Math.random()
    * (max-min+1)
  ) + min;
}


function pick(arr) {

  return arr[
    r(
      0,
      arr.length-1
    )
  ];
}


function makeQuestion() {

  const lvl =
    getLevelIndex();


  if (lvl === 9) {

    const a =
      pick([
        2,3,4,5,6,7,8,9,10
      ]);

    const b =
      r(0,10);

    correctAnswer =
      b;

    qEl.textContent =
      `${a} × … = ${a*b}`;

    return;
  }


  if (lvl === 10) {

    const type =
      pick([
        "tiental",
        "honderdtal",
        "tientalxtiental"
      ]);


    if (type === "tiental") {

      const a =
        pick([
          10,20,30,40,50,
          60,70,80,90
        ]);

      const b =
        r(2,9);

      correctAnswer =
        a*b;

      qEl.textContent =
        `${a} × ${b}`;

      return;
    }


    if (type === "honderdtal") {

      const a =
        pick([
          100,200,300,
          400,500,600,
          700,800,900
        ]);

      const b =
        r(2,9);

      correctAnswer =
        a*b;

      qEl.textContent =
        `${a} × ${b}`;

      return;
    }


    const a =
      pick([
        10,20,30,40,50,
        60,70,80,90
      ]);

    const b =
      pick([
        10,20,30,40,50,
        60,70,80,90
      ]);

    correctAnswer =
      a*b;

    qEl.textContent =
      `${a} × ${b}`;

    return;
  }


  let tables =
    [2];


  if (lvl === 0) {
    tables = [2];
  }

  if (lvl === 1) {
    tables = [2,10];
  }

  if (lvl === 2) {
    tables = [2,5,10];
  }

  if (lvl === 3) {
    tables = [3,4];
  }

  if (lvl === 4) {
    tables = [2,3,4,5,10];
  }

  if (lvl === 5) {
    tables = [6,7];
  }

  if (lvl === 6) {
    tables = [2,3,4,5,6,7,10];
  }

  if (lvl === 7) {
    tables = [8,9];
  }

  if (lvl === 8) {
    tables = [2,3,4,5,6,7,8,9,10];
  }


  const tafel =
    pick(tables);

  const getal =
    r(0,10);

  correctAnswer =
    getal*tafel;

  qEl.textContent =
    `${getal} × ${tafel}`;
}


function saveLocalKeerLevel() {

  const d =
    getLocalData();

  d.levels =
    d.levels || {
      plus:0,
      min:0,
      keer:0,
      deel:0
    };

  d.levels.keer =
    levels.keer;

  setLocalData(d);
}


async function saveFinishedRound(
  promoted
) {

  if (promoted) {

    saveLocalKeerLevel();
  }


  if (sheetsOk) {

    await sheetsFinishKeer(
      studentClass,
      studentId,
      studentCode,
      promoted,
      levels.keer
    );
  }
}


function startRun() {

  if (running) {
    return;
  }

  running = true;

  startBtn.disabled = true;

  time = SECONDS;
  good = 0;
  tries = 0;

  fmtTime();

  goodEl.textContent = "0";
  triesEl.textContent = "0";
  resultEl.textContent = "";

  clearFeedback();

  aEl.disabled = false;
  aEl.value = "";
  aEl.focus();

  makeQuestion();

  clearInterval(timer);

  timer =
    setInterval(
      () => {

        time--;

        fmtTime();

        if (time <= 0) {

          endRun();
        }

      },
      1000
    );
}


async function endRun() {

  if (!running) {
    return;
  }

  clearInterval(timer);

  timer = null;
  running = false;

  aEl.disabled = true;
  startBtn.disabled = false;


  const oldLevel =
    getLevelIndex();


  const promoted =
    good >= PROMOTE_AT
    &&
    oldLevel < LEVELS.length-1;


  if (promoted) {

    levels.keer =
      oldLevel+1;
  }


  sheetStatusEl.textContent =
    sheetsOk
      ? "Sheets: spel opslaan…"
      : "Lokaal: opslaan…";


  try {

    await saveFinishedRound(
      promoted
    );

    sheetStatusEl.textContent =
      sheetsOk
        ? "Sheets: opgeslagen ✅"
        : "Lokaal: opgeslagen ✅";

  } catch(e) {

    sheetStatusEl.textContent =
      "Sheets: opslaan mislukt ⚠️";
  }


  const pct =
    Math.round(
      (good/tries)*100
    ) || 0;


  resultEl.textContent =
    `Je had ${good} goed van ${tries} pogingen. (${pct}%)`
    +
    (
      promoted
        ? " 🎉 Niveau omhoog!"
        : ` (Huidig niveau: ${LEVELS[oldLevel]})`
    );


  renderLevel();
}


function submitAnswer() {

  if (!running) {
    return;
  }


  const raw =
    aEl.value
      .trim()
      .replace(
        /[^0-9]/g,
        ""
      );


  if (raw === "") {
    return;
  }


  tries++;

  triesEl.textContent =
    tries;


  if (
    Number(raw)
    ===
    correctAnswer
  ) {

    good++;

    goodEl.textContent =
      good;

    setFeedback(
      "Goed!",
      true
    );

  } else {

    setFeedback(
      `Fout (antwoord: ${correctAnswer})`,
      false
    );
  }


  aEl.value =
    "";

  makeQuestion();

  aEl.focus();
}


aEl.addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter") {

      submitAnswer();
    }
  }
);


startBtn.addEventListener(
  "click",
  startRun
);


(function initLocal() {

  fmtTime();

  const d =
    getLocalData();

  levels = {
    plus:Number(d.levels?.plus)||0,
    min:Number(d.levels?.min)||0,
    keer:Number(d.levels?.keer)||0,
    deel:Number(d.levels?.deel)||0
  };

  renderLevel();

})();


(async function initSheets() {

  startBtn.disabled = true;

  sheetStatusEl.textContent =
    "Sheets: laden…";


  try {

    const res =
      await sheetsGet(
        studentClass,
        studentId,
        studentCode
      );


    if (
      !res ||
      res.ok !== true ||
      !res.levels
    ) {

      throw new Error(
        "Ongeldig antwoord"
      );
    }


    levels = {
      plus:Number(res.levels.plus)||0,
      min:Number(res.levels.min)||0,
      keer:Number(res.levels.keer)||0,
      deel:Number(res.levels.deel)||0
    };


    sheetsOk = true;

    sheetStatusEl.textContent =
      "Sheets: verbonden ✅";


    const d =
      getLocalData();

    d.levels = {
      ...d.levels,
      ...levels
    };

    setLocalData(d);


  } catch(e) {

    sheetsOk = false;

    sheetStatusEl.textContent =
      "Kon niveau niet laden uit Sheets.";
  }


  renderLevel();

  startBtn.disabled = false;

})();

</script>

</body>
</html>
