<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keersommen – adaptief</title>

  <style>
    body{
      font-family:system-ui,sans-serif;
      background:#f4f6ff;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      background:#fff;
      padding:2.2rem 2.4rem;
      border-radius:1.5rem;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
      max-width:780px;
      width:95%;
      text-align:center;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:1rem;
      margin-bottom:1rem;
      flex-wrap:wrap;
    }

    a.small{
      color:#4f46e5;
      text-decoration:none;
      font-weight:800;
    }

    .pill{
      display:inline-block;
      padding:.35rem .7rem;
      border-radius:999px;
      background:#eef2ff;
      font-weight:900;
    }

    h1{
      margin:.2rem 0 .2rem;
    }

    .sub{
      color:#555;
      margin:0 0 .75rem;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:.8rem;
      flex-wrap:wrap;
      margin:1rem 0;
      font-weight:900;
    }

    .q{
      font-size:3rem;
      margin:1rem 0;
      min-height:3rem;
    }

    input{
      font-size:1.6rem;
      padding:.5rem .9rem;
      width:240px;
      text-align:center;
      border-radius:.9rem;
      border:2px solid #ccc;
      outline:none;
    }

    input:focus{
      border-color:#4f46e5;
      box-shadow:0 0 0 3px rgba(79,70,229,.15);
    }

    button{
      padding:.8rem 1.3rem;
      border:none;
      border-radius:999px;
      background:#4f46e5;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    button:disabled{
      background:#bbb;
      cursor:default;
    }

    .feedback{
      min-height:1.4rem;
      margin-top:.5rem;
      font-weight:900;
    }

    .good{
      color:#16a34a;
    }

    .bad{
      color:#dc2626;
    }

    .result{
      margin-top:1rem;
      font-weight:900;
      line-height:1.5;
    }

    .smalltxt{
      font-size:.85rem;
      color:#666;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="top">
    <a class="small" href="menu.html">← Menu</a>

    <div>
      <span class="pill" id="who">—</span>
      <span class="pill" id="whichClass">—</span>
    </div>
  </div>

  <h1>Keersommen</h1>

  <p class="sub">
    Niveau omhoog bij
    <b>24 goed én minimaal 90%</b>
    in 2 minuten.
  </p>

  <div class="smalltxt" id="sheetStatus">
    Sheets: verbinden…
  </div>

  <div class="row">
    <div>⏱ <span id="time">2:00</span></div>
    <div>✅ <span id="good">0</span></div>
    <div>📊 <span id="tries">0</span></div>
  </div>

  <div class="pill" id="level">
    Niveau: laden…
  </div>

  <div class="q" id="question">
    Druk op start
  </div>

  <input
    id="answer"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="antwoord"
    disabled
  >

  <div id="feedback" class="feedback"></div>

  <div style="margin-top:1rem">
    <button id="startBtn" disabled>
      Start 2-minutentest
    </button>
  </div>

  <div id="result" class="result"></div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbz-13F67vdmwulyOw5QVfO9AW25louOoFU6on6MlBvbSzxjzjuR8mbEwfTHzSZaSCeyvQ/exec";


/* =========================================================
   OPSLAG
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";

const STORAGE_DATA_PREFIX =
  "rekenen_data_v3_";


const studentId =
  (localStorage.getItem(STORAGE_CURRENT) || "").trim();

const studentClass =
  (localStorage.getItem(STORAGE_CLASS) || "").trim();

const studentCode =
  (localStorage.getItem(STORAGE_CODE) || "").trim();


if (
  !studentId ||
  !studentClass ||
  !studentCode
) {

  location.href =
    "index.html";
}


document.getElementById("who").textContent =
  `Leerling: ${studentId}`;

document.getElementById("whichClass").textContent =
  `Klas: ${studentClass}`;


/* =========================================================
   LOKALE BACK-UP
========================================================= */

function dataKey() {

  return STORAGE_DATA_PREFIX
    + studentClass
    + "__"
    + studentId;
}


function getLocalData() {

  const raw =
    localStorage.getItem(
      dataKey()
    );


  return raw
    ? JSON.parse(raw)
    : {
        levels:{
          plus:0,
          min:0,
          keer:0,
          deel:0
        }
      };
}


function setLocalData(d) {

  localStorage.setItem(
    dataKey(),
    JSON.stringify(d)
  );
}


/* =========================================================
   JSONP
========================================================= */

let jsonpSeq =
  0;


function jsonp(url) {

  return new Promise(
    (resolve,reject) => {

      const cb =
        "__cb_"
        + (++jsonpSeq)
        + "_"
        + Date.now();


      const script =
        document.createElement(
          "script"
        );


      const cleanup = () => {

        try {

          delete window[cb];

        } catch(e) {}


        script.remove();
      };


      window[cb] = data => {

        cleanup();

        resolve(data);
      };


      script.onerror = () => {

        cleanup();

        reject(
          new Error(
            "JSONP failed"
          )
        );
      };


      const sep =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url
        + sep
        + "callback="
        + encodeURIComponent(cb);


      document.body.appendChild(
        script
      );
    }
  );
}


/* =========================================================
   SHEETS OPHALEN
========================================================= */

async function sheetsGet(
  klas,
  naam,
  code
) {

  return await jsonp(
    `${SHEETS_EXEC_URL}?action=get`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
  );
}


/* =========================================================
   KEER-RONDE OPSLAAN
========================================================= */

async function sheetsFinishKeer(
  klas,
  naam,
  code,
  promoted,
  mastered,
  keerLevel
) {

  let url =
    `${SHEETS_EXEC_URL}?action=set`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
    + `&played=1`
    + `&promoted=${promoted ? 1 : 0}`
    + `&mastered=${mastered ? 1 : 0}`
    + `&game=keer`;


  /*
    Alleen een nieuw niveau meesturen
    wanneer er echt promotie is.
  */

  if (
    promoted
  ) {

    url +=
      `&keer=${encodeURIComponent(keerLevel)}`;
  }


  return await jsonp(
    url
  );
}


/* =========================================================
   INSTELLINGEN
========================================================= */

const MIN_GOED =
  24;

const MIN_PERCENTAGE =
  90;

const FOUT_WACHTTIJD_MS =
  700;


/*
  Na 5 fouten achter elkaar
  stopt de ronde.
*/

const MAX_FOUTEN_OP_RIJ =
  5;


const SECONDS =
  120;


/* =========================================================
   NIVEAUS
========================================================= */

const LEVELS = [

  "Tafel van 2",

  "Tafel van 2 en 10",

  "Tafel van 2, 5 en 10",

  "Tafel van 3 en 4",

  "Tafel van 2,3,4,5 en 10",

  "Tafel van 6 en 7",

  "Tafel van 2,3,4,5,6,7 en 10",

  "Tafel van 8 en 9",

  "Alle tafels",

  "Stipsommen met tafels (8 × … = 56)",

  "Grote keersommen (80×9, 800×9, 80×90)"

];


/* =========================================================
   ELEMENTEN
========================================================= */

const qEl =
  document.getElementById(
    "question"
  );

const aEl =
  document.getElementById(
    "answer"
  );

const fEl =
  document.getElementById(
    "feedback"
  );

const tEl =
  document.getElementById(
    "time"
  );

const goodEl =
  document.getElementById(
    "good"
  );

const triesEl =
  document.getElementById(
    "tries"
  );

const levelEl =
  document.getElementById(
    "level"
  );

const startBtn =
  document.getElementById(
    "startBtn"
  );

const sheetStatusEl =
  document.getElementById(
    "sheetStatus"
  );

const resultEl =
  document.getElementById(
    "result"
  );


/* =========================================================
   STATUS
========================================================= */

let running =
  false;

let timer =
  null;

let foutTimer =
  null;

let time =
  SECONDS;

let good =
  0;

let tries =
  0;

let correctAnswer =
  0;

let antwoordGeblokkeerd =
  false;

let foutenOpRij =
  0;

let sheetsOk =
  false;


let levels = {
  plus:0,
  min:0,
  keer:0,
  deel:0
};


/* =========================================================
   NIVEAU
========================================================= */

function clampLevel(
  lvl
) {

  return Math.max(
    0,
    Math.min(
      Number(lvl) || 0,
      LEVELS.length - 1
    )
  );
}


function getLevelIndex() {

  return clampLevel(
    levels.keer
  );
}


function renderLevel() {

  const lvl =
    getLevelIndex();


  levelEl.textContent =
    "Niveau: "
    + LEVELS[lvl];
}


/* =========================================================
   HULPFUNCTIES
========================================================= */

function fmtTime() {

  tEl.textContent =
    `${Math.floor(time/60)}:`
    + String(
        time % 60
      ).padStart(
        2,
        "0"
      );
}


function r(
  min,
  max
) {

  return Math.floor(
    Math.random()
    * (max-min+1)
  ) + min;
}


function pick(
  arr
) {

  return arr[
    r(
      0,
      arr.length-1
    )
  ];
}


function setFeedback(
  text,
  ok
) {

  fEl.textContent =
    text;


  fEl.className =
    "feedback "
    + (
      ok
        ? "good"
        : "bad"
    );
}


function clearFeedback() {

  fEl.textContent =
    "";

  fEl.className =
    "feedback";
}


/* =========================================================
   SOM MAKEN
========================================================= */

function makeQuestion() {

  if (
    !running
  ) {

    return;
  }


  const lvl =
    getLevelIndex();


  /* =======================================================
     NIVEAU 10
     STIPSOMMEN
  ======================================================= */

  if (
    lvl === 9
  ) {

    const a =
      pick(
        [
          2,3,4,5,6,7,8,9,10
        ]
      );


    const b =
      r(
        0,
        10
      );


    correctAnswer =
      b;


    qEl.textContent =
      `${a} × … = ${a*b}`;


    return;
  }


  /* =======================================================
     NIVEAU 11
     GROTE KEERSOMMEN
  ======================================================= */

  if (
    lvl === 10
  ) {

    const type =
      pick(
        [
          "tiental",
          "honderdtal",
          "tientalxtiental"
        ]
      );


    if (
      type === "tiental"
    ) {

      const a =
        pick(
          [
            10,20,30,40,50,
            60,70,80,90
          ]
        );


      const b =
        r(
          2,
          9
        );


      correctAnswer =
        a*b;


      qEl.textContent =
        `${a} × ${b}`;


      return;
    }


    if (
      type === "honderdtal"
    ) {

      const a =
        pick(
          [
            100,200,300,400,500,
            600,700,800,900
          ]
        );


      const b =
        r(
          2,
          9
        );


      correctAnswer =
        a*b;


      qEl.textContent =
        `${a} × ${b}`;


      return;
    }


    const a =
      pick(
        [
          10,20,30,40,50,
          60,70,80,90
        ]
      );


    const b =
      pick(
        [
          10,20,30,40,50,
          60,70,80,90
        ]
      );


    correctAnswer =
      a*b;


    qEl.textContent =
      `${a} × ${b}`;


    return;
  }


  /* =======================================================
     NIVEAU 1 T/M 9
  ======================================================= */

  let tables =
    [2];


  if (
    lvl === 0
  ) {

    tables =
      [2];
  }


  if (
    lvl === 1
  ) {

    tables =
      [2,10];
  }


  if (
    lvl === 2
  ) {

    tables =
      [2,5,10];
  }


  if (
    lvl === 3
  ) {

    tables =
      [3,4];
  }


  if (
    lvl === 4
  ) {

    tables =
      [2,3,4,5,10];
  }


  if (
    lvl === 5
  ) {

    tables =
      [6,7];
  }


  if (
    lvl === 6
  ) {

    tables =
      [2,3,4,5,6,7,10];
  }


  if (
    lvl === 7
  ) {

    tables =
      [8,9];
  }


  if (
    lvl === 8
  ) {

    tables =
      [2,3,4,5,6,7,8,9,10];
  }


  const tafel =
    pick(
      tables
    );


  const getal =
    r(
      0,
      10
    );


  correctAnswer =
    getal * tafel;


  qEl.textContent =
    `${getal} × ${tafel}`;
}


/* =========================================================
   LOKAAL OPSLAAN
========================================================= */

function saveLocalKeerLevel() {

  const d =
    getLocalData();


  d.levels =
    d.levels || {
      plus:0,
      min:0,
      keer:0,
      deel:0
    };


  d.levels.keer =
    levels.keer;


  setLocalData(
    d
  );
}


/* =========================================================
   VOLLEDIGE RONDE OPSLAAN
========================================================= */

async function saveFinishedRound(
  promoted,
  mastered
) {

  /*
    Alleen bij promotie
    verandert het niveau.
  */

  if (
    promoted
  ) {

    saveLocalKeerLevel();
  }


  if (
    sheetsOk
  ) {

    await sheetsFinishKeer(
      studentClass,
      studentId,
      studentCode,
      promoted,
      mastered,
      levels.keer
    );
  }
}


/* =========================================================
   START
========================================================= */

function startRun() {

  if (
    running
  ) {

    return;
  }


  clearTimeout(
    foutTimer
  );


  running =
    true;


  antwoordGeblokkeerd =
    false;


  foutenOpRij =
    0;


  time =
    SECONDS;


  good =
    0;


  tries =
    0;


  fmtTime();


  goodEl.textContent =
    "0";


  triesEl.textContent =
    "0";


  clearFeedback();


  resultEl.textContent =
    "";


  aEl.disabled =
    false;


  startBtn.disabled =
    true;


  aEl.value =
    "";


  aEl.focus();


  makeQuestion();


  clearInterval(
    timer
  );


  timer =
    setInterval(
      () => {

        time--;


        fmtTime();


        if (
          time <= 0
        ) {

          endRun(
            "tijd"
          );
        }

      },
      1000
    );
}


/* =========================================================
   EINDE
========================================================= */

async function endRun(
  reden = "tijd"
) {

  if (
    !running
  ) {

    return;
  }


  running =
    false;


  clearInterval(
    timer
  );


  timer =
    null;


  clearTimeout(
    foutTimer
  );


  foutTimer =
    null;


  antwoordGeblokkeerd =
    true;


  aEl.disabled =
    true;


  startBtn.disabled =
    true;


  const percentage =
    tries > 0
      ? Math.round(
          (good / tries) * 100
        )
      : 0;


  const oldLevel =
    getLevelIndex();


  /*
    Alleen een volledige ronde van 2 minuten
    kan tot promotie of afronding leiden.
  */

  const voldoetAanEisen =
    reden === "tijd"
    &&
    good >= MIN_GOED
    &&
    percentage >= MIN_PERCENTAGE;


  /*
    Promotie zolang er nog een volgend niveau is.
  */

  const promoted =
    voldoetAanEisen
    &&
    oldLevel < LEVELS.length - 1;


  /*
    Hoogste niveau behaald:

    Keer heeft 11 niveaus.
    Intern is niveau 11 dus index 10.
  */

  const mastered =
    voldoetAanEisen
    &&
    oldLevel === LEVELS.length - 1;


  if (
    promoted
  ) {

    levels.keer =
      oldLevel + 1;
  }


  /*
    Alleen een volledige ronde opslaan.

    Bij 5 fouten achter elkaar:
    NIETS naar Sheets sturen.
  */

  if (
    reden === "tijd"
  ) {

    sheetStatusEl.textContent =
      sheetsOk
        ? "Sheets: spel opslaan…"
        : "Lokaal: opslaan…";


    try {

      await saveFinishedRound(
        promoted,
        mastered
      );


      sheetStatusEl.textContent =
        sheetsOk
          ? "Sheets: opgeslagen ✅"
          : "Lokaal: opgeslagen ✅";


    } catch(e) {

      sheetStatusEl.textContent =
        "Sheets: opslaan mislukt ⚠️";
    }

  } else {

    sheetStatusEl.textContent =
      "Ronde afgebroken – niet opgeslagen";
  }


  let tekst =
    `${good} goed van ${tries} pogingen. `
    + `${percentage}% goed.`;


  if (
    reden === "teveel_fouten"
  ) {

    tekst +=
      ` Ronde gestopt: ${MAX_FOUTEN_OP_RIJ} fouten achter elkaar. `
      + `Deze ronde is niet opgeslagen.`;

  } else if (
    mastered
  ) {

    tekst +=
      " 🏆 Gefeliciteerd! Je hebt het hoogste niveau van Keersommen behaald!";

  } else if (
    promoted
  ) {

    tekst +=
      " 🎉 Niveau omhoog!";

  } else if (
    good >= MIN_GOED
    &&
    percentage < MIN_PERCENTAGE
  ) {

    tekst +=
      ` Je was snel genoeg, maar voor niveau omhoog is minimaal ${MIN_PERCENTAGE}% goed nodig.`;

  } else if (
    good < MIN_GOED
    &&
    percentage >= MIN_PERCENTAGE
  ) {

    tekst +=
      ` Je werkte nauwkeurig. Voor niveau omhoog zijn minimaal ${MIN_GOED} goede antwoorden nodig.`;

  } else {

    tekst +=
      ` Voor niveau omhoog heb je minimaal ${MIN_GOED} goed én ${MIN_PERCENTAGE}% nodig.`;
  }


  resultEl.textContent =
    tekst;


  renderLevel();


  startBtn.disabled =
    false;
}


/* =========================================================
   ANTWOORD
========================================================= */

function submitAnswer() {

  if (
    !running
    ||
    antwoordGeblokkeerd
  ) {

    return;
  }


  const raw =
    aEl.value
      .trim()
      .replace(
        /[^0-9]/g,
        ""
      );


  if (
    raw === ""
  ) {

    return;
  }


  tries++;


  triesEl.textContent =
    String(
      tries
    );


  /* =======================================================
     GOED
  ======================================================= */

  if (
    Number(raw) ===
    correctAnswer
  ) {

    good++;


    foutenOpRij =
      0;


    goodEl.textContent =
      String(
        good
      );


    setFeedback(
      "Goed!",
      true
    );


    aEl.value =
      "";


    makeQuestion();


    aEl.focus();


    return;
  }


  /* =======================================================
     FOUT
  ======================================================= */

  foutenOpRij++;


  antwoordGeblokkeerd =
    true;


  aEl.disabled =
    true;


  setFeedback(
    `Helaas, het was ${correctAnswer}.`,
    false
  );


  /*
    Na 5 fouten achter elkaar:
    ronde stoppen.
  */

  if (
    foutenOpRij >=
    MAX_FOUTEN_OP_RIJ
  ) {

    foutTimer =
      setTimeout(
        () => {

          endRun(
            "teveel_fouten"
          );

        },
        FOUT_WACHTTIJD_MS
      );


    return;
  }


  /*
    Anders na 0,7 seconde verder.
  */

  foutTimer =
    setTimeout(
      () => {

        if (
          !running
        ) {

          return;
        }


        clearFeedback();


        aEl.value =
          "";


        aEl.disabled =
          false;


        antwoordGeblokkeerd =
          false;


        makeQuestion();


        aEl.focus();

      },
      FOUT_WACHTTIJD_MS
    );
}


/* =========================================================
   EVENTS
========================================================= */

aEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
    ) {

      submitAnswer();
    }
  }
);


startBtn.addEventListener(
  "click",
  startRun
);


/* =========================================================
   LOKALE DATA LADEN
========================================================= */

(function initLocal() {

  fmtTime();


  const d =
    getLocalData();


  levels = {

    plus:
      Number(
        d.levels?.plus
      ) || 0,

    min:
      Number(
        d.levels?.min
      ) || 0,

    keer:
      Number(
        d.levels?.keer
      ) || 0,

    deel:
      Number(
        d.levels?.deel
      ) || 0
  };


  renderLevel();

})();


/* =========================================================
   GOOGLE SHEETS LADEN
========================================================= */

(async function initSheets() {

  startBtn.disabled =
    true;


  sheetStatusEl.textContent =
    "Sheets: laden…";


  try {

    const res =
      await sheetsGet(
        studentClass,
        studentId,
        studentCode
      );


    if (
      !res
      ||
      res.ok !== true
      ||
      !res.levels
    ) {

      throw new Error(
        "Ongeldig antwoord"
      );
    }


    levels = {

      plus:
        Number(
          res.levels.plus
        ) || 0,

      min:
        Number(
          res.levels.min
        ) || 0,

      keer:
        Number(
          res.levels.keer
        ) || 0,

      deel:
        Number(
          res.levels.deel
        ) || 0
    };


    sheetsOk =
      true;


    sheetStatusEl.textContent =
      "Sheets: verbonden ✅";


    const d =
      getLocalData();


    d.levels = {
      ...d.levels,
      ...levels
    };


    setLocalData(
      d
    );


  } catch(e) {

    sheetsOk =
      false;


    sheetStatusEl.textContent =
      "Kon niveau niet laden uit Sheets.";
  }


  renderLevel();


  startBtn.disabled =
    false;

})();

</script>

</body>
</html>
