<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Menu</title>

<style>
body{
  font-family:system-ui;
  background:#f4f6ff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#fff;
  padding:2rem;
  border-radius:1.5rem;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  width:100%;
  max-width:600px;
}

h1{text-align:center}

.grid{
  display:grid;
  gap:1rem;
  margin-top:1rem;
}

.btn{
  padding:1rem;
  border-radius:1rem;
  background:#4f46e5;
  color:white;
  text-align:center;
  text-decoration:none;
  font-weight:900;
}
</style>
</head>

<body>
<div class="box">
  <h1 id="title"></h1>

  <div class="grid">
    <a class="btn" href="plus.html">Optellen</a>
    <a class="btn" href="min.html">Aftrekken</a>
    <a class="btn" href="keer.html">Keer</a>
    <a class="btn" href="deel.html">Delen</a>
  </div>
</div>

<script>
const name = localStorage.getItem("rekenen_name");
if(!name) location.href = "index.html";

document.getElementById("title").textContent = "Welkom " + name;
</script>
</body>
</html>
