<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekenen – Menu</title>

  <style>

    body{
      font-family:system-ui,sans-serif;
      background:#f4f6ff;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      background:#fff;
      padding:2rem 2.2rem;
      border-radius:1.5rem;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
      max-width:900px;
      width:95%;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:1rem;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    h1{
      margin:.2rem 0;
      font-size:2rem;
    }

    .pill{
      display:inline-block;
      padding:.35rem .7rem;
      border-radius:999px;
      background:#eef2ff;
      font-weight:900;
      margin-left:.4rem;
    }

    .status{
      font-size:.9rem;
      color:#555;
      margin-top:.15rem;
    }

    .grid{
      display:grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px,1fr)
        );
      gap:1rem;
      margin-top:1.2rem;
    }

    .card{
      background:#f7f8ff;
      border:1px solid #e6e8ff;
      border-radius:1.2rem;
      padding:1rem;
    }

    .card h2{
      margin:.1rem 0 .4rem;
      font-size:1.2rem;
    }

    .lvl{
      font-weight:900;
      margin:.25rem 0 .7rem;
      color:#111;
      min-height:2.8em;
    }

    .btn{
      display:inline-block;
      border:none;
      border-radius:999px;
      padding:.75rem 1rem;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      text-align:center;
    }

    .primary{
      background:#4f46e5;
      color:#fff;
    }

    .sep{
      height:1px;
      background:#ececff;
      margin:1.2rem 0;
    }

    a.link{
      color:#4f46e5;
      font-weight:900;
      text-decoration:none;
    }

  </style>
</head>


<body>

<div class="box">

  <div class="top">

    <div>

      <h1>
        Rekenen – menu
      </h1>

      <div
        class="status"
        id="sheetStatus"
      >
        Sheets: verbinden…
      </div>

    </div>


    <div>

      <span
        class="pill"
        id="who"
      >
        Leerling: —
      </span>

      <span
        class="pill"
        id="whichClass"
      >
        Klas: —
      </span>

    </div>

  </div>


  <div class="grid">


    <!-- OPTELLEN -->

    <div class="card">

      <h2>
        Optellen +
      </h2>

      <div
        class="lvl"
        id="lvlPlus"
      >
        Niveau: laden…
      </div>

      <a
        class="btn primary"
        href="plus.html"
      >
        Start optellen
      </a>

    </div>


    <!-- AFTREKKEN -->

    <div class="card">

      <h2>
        Aftrekken -
      </h2>

      <div
        class="lvl"
        id="lvlMin"
      >
        Niveau: laden…
      </div>

      <a
        class="btn primary"
        href="min.html"
      >
        Start aftrekken
      </a>

    </div>


    <!-- KEER -->

    <div class="card">

      <h2>
        Keer ×
      </h2>

      <div
        class="lvl"
        id="lvlKeer"
      >
        Niveau: laden…
      </div>

      <a
        class="btn primary"
        href="keer.html"
      >
        Start keersommen
      </a>

    </div>


    <!-- DELEN -->

    <div class="card">

      <h2>
        Delen :
      </h2>

      <div
        class="lvl"
        id="lvlDeel"
      >
        Niveau: laden…
      </div>

      <a
        class="btn primary"
        href="delen.html"
      >
        Start deelsommen
      </a>

    </div>

  </div>


  <div class="sep"></div>


  <a
    class="link"
    href="index.html"
  >
    Andere leerling kiezen
  </a>


  <div class="sep"></div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbz-13F67vdmwulyOw5QVfO9AW25louOoFU6on6MlBvbSzxjzjuR8mbEwfTHzSZaSCeyvQ/exec";


/* =========================================================
   OPSLAG
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";

const STORAGE_DATA_PREFIX =
  "rekenen_data_v3_";


const studentId =
  (
    localStorage.getItem(
      STORAGE_CURRENT
    )
    || ""
  ).trim();


const studentClass =
  (
    localStorage.getItem(
      STORAGE_CLASS
    )
    || ""
  ).trim();


const studentCode =
  (
    localStorage.getItem(
      STORAGE_CODE
    )
    || ""
  ).trim();


/* =========================================================
   CONTROLE INLOG
========================================================= */

if (
  !studentId
  ||
  !studentClass
  ||
  !studentCode
) {

  location.href =
    "index.html";
}


/* =========================================================
   LEERLING TONEN
========================================================= */

document
  .getElementById(
    "who"
  )
  .textContent =
    `Leerling: ${studentId}`;


document
  .getElementById(
    "whichClass"
  )
  .textContent =
    `Klas: ${studentClass}`;


/* =========================================================
   LOKALE BACK-UP
========================================================= */

function dataKey() {

  return STORAGE_DATA_PREFIX
    + studentClass
    + "__"
    + studentId;
}


function getLocalData() {

  const raw =
    localStorage.getItem(
      dataKey()
    );


  if (
    !raw
  ) {

    return {

      levels:{
        plus:0,
        min:0,
        keer:0,
        deel:0
      }

    };
  }


  try {

    return JSON.parse(
      raw
    );

  } catch(e) {

    return {

      levels:{
        plus:0,
        min:0,
        keer:0,
        deel:0
      }

    };
  }
}


function setLocalData(
  data
) {

  localStorage.setItem(
    dataKey(),
    JSON.stringify(
      data
    )
  );
}


/* =========================================================
   JSONP
========================================================= */

let jsonpSeq =
  0;


function jsonp(
  url
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        "__cb_"
        + (++jsonpSeq)
        + "_"
        + Date.now();


      const script =
        document.createElement(
          "script"
        );


      let timeout =
        null;


      const cleanup =
        () => {

          clearTimeout(
            timeout
          );


          try {

            delete window[
              callbackName
            ];

          } catch(e) {}


          script.remove();

        };


      window[
        callbackName
      ] =
        data => {

          cleanup();

          resolve(
            data
          );
        };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              "JSONP failed"
            )
          );
        };


      const separator =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url
        + separator
        + "callback="
        + encodeURIComponent(
            callbackName
          )
        + "&_="
        + Date.now();


      timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "Timeout"
              )
            );

          },
          10000
        );


      document.body.appendChild(
        script
      );

    }
  );
}


/* =========================================================
   SHEETS OPHALEN
========================================================= */

async function sheetsGet(
  klas,
  naam,
  code
) {

  const url =
    `${SHEETS_EXEC_URL}?action=get`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`;


  return await jsonp(
    url
  );
}


/* =========================================================
   NAMEN VAN DE NIVEAUS
========================================================= */

const PLUS_NAMES = [

  "t/m 10",

  "stipsommen t/m 10",

  "10–20 (14+3)",

  "vriendjes van 10",

  "t/m 20 overschrijding",

  "stipsommen t/m 20",

  "t/m 100 tientallen",

  "43+20",

  "43+3",

  "58+6",

  "42+14",

  "48+24"

];


const MIN_NAMES = [

  "t/m 10",

  "stipsommen t/m 10",

  "10–20 (14-3)",

  "vriendjes van 10",

  "t/m 20 overschrijding",

  "stipsommen t/m 20",

  "t/m 100 tientallen",

  "43-20",

  "46-3",

  "54-6",

  "48-14",

  "42-24"

];


const KEER_NAMES = [

  "tafel 2",

  "tafel 2 & 10",

  "2 / 5 / 10",

  "3 & 4",

  "2 / 3 / 4 / 5 / 10",

  "6 & 7",

  "2 / 3 / 4 / 5 / 6 / 7 / 10",

  "8 & 9",

  "alle tafels",

  "stipsommen",

  "grote keersommen"

];


const DEEL_NAMES = [

  "deel 2",

  "2 & 10",

  "2 / 5 / 10",

  "3 & 4",

  "2 / 3 / 4 / 5 / 10",

  "6 & 7",

  "2 / 3 / 4 / 5 / 6 / 7 / 10",

  "8 & 9",

  "alle deeltafels",

  "stipsommen",

  "grotere deelsommen",

  "t/m 100 (≤20)"

];


/* =========================================================
   NIVEAU BEGRENZEN
========================================================= */

function clamp(
  number,
  max
) {

  let n =
    Number(
      number
    ) || 0;


  if (
    n < 0
  ) {

    n = 0;
  }


  if (
    n > max
  ) {

    n = max;
  }


  return n;
}


/* =========================================================
   NIVEAUS TONEN
========================================================= */

function render(
  levels
) {

  const plus =
    clamp(
      levels.plus,
      PLUS_NAMES.length - 1
    );


  const min =
    clamp(
      levels.min,
      MIN_NAMES.length - 1
    );


  const keer =
    clamp(
      levels.keer,
      KEER_NAMES.length - 1
    );


  const deel =
    clamp(
      levels.deel,
      DEEL_NAMES.length - 1
    );


  document
    .getElementById(
      "lvlPlus"
    )
    .textContent =
      `Niveau ${plus + 1}: ${PLUS_NAMES[plus]}`;


  document
    .getElementById(
      "lvlMin"
    )
    .textContent =
      `Niveau ${min + 1}: ${MIN_NAMES[min]}`;


  document
    .getElementById(
      "lvlKeer"
    )
    .textContent =
      `Niveau ${keer + 1}: ${KEER_NAMES[keer]}`;


  document
    .getElementById(
      "lvlDeel"
    )
    .textContent =
      `Niveau ${deel + 1}: ${DEEL_NAMES[deel]}`;

}


/* =========================================================
   HUIDIGE NIVEAUS
========================================================= */

let levels = {

  plus:0,

  min:0,

  keer:0,

  deel:0

};


/* =========================================================
   EERST LOKAAL TONEN
========================================================= */

function renderFromLocalFirst() {

  const data =
    getLocalData();


  levels = {

    plus:
      Number(
        data.levels?.plus
      ) || 0,

    min:
      Number(
        data.levels?.min
      ) || 0,

    keer:
      Number(
        data.levels?.keer
      ) || 0,

    deel:
      Number(
        data.levels?.deel
      ) || 0

  };


  render(
    levels
  );
}


/* =========================================================
   DAARNA SHEETS LADEN
========================================================= */

async function loadFromSheets() {

  const status =
    document.getElementById(
      "sheetStatus"
    );


  status.textContent =
    "Sheets: laden…";


  try {

    const result =
      await sheetsGet(
        studentClass,
        studentId,
        studentCode
      );


    if (
      !result
      ||
      result.ok !== true
      ||
      !result.levels
    ) {

      throw new Error(
        result?.error
        ||
        "Ongeldig antwoord"
      );
    }


    levels = {

      plus:
        Number(
          result.levels.plus
        ) || 0,

      min:
        Number(
          result.levels.min
        ) || 0,

      keer:
        Number(
          result.levels.keer
        ) || 0,

      deel:
        Number(
          result.levels.deel
        ) || 0

    };


    const local =
      getLocalData();


    local.levels = {
      ...local.levels,
      ...levels
    };


    setLocalData(
      local
    );


    render(
      levels
    );


    status.textContent =
      "Sheets: verbonden ✅";


  } catch(e) {


    /*
      Sheets niet bereikbaar:
      lokaal niveau blijft zichtbaar.
    */

    renderFromLocalFirst();


    status.textContent =
      "Sheets: niet bereikbaar – lokale niveaus gebruikt.";

  }
}


/* =========================================================
   START
========================================================= */

renderFromLocalFirst();

loadFromSheets();

</script>

</body>
</html>
