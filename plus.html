<body>

<div class="box">

  <div class="top">

    <a class="small" href="menu.html">
      ← Menu
    </a>

    <div>
      <span class="pill" id="who">—</span>
      <span class="pill" id="whichClass">—</span>
    </div>

  </div>


  <h1>Optellen</h1>


  <p class="sub">
    Adaptief: niveau omhoog bij
    <b>24 of meer</b>
    goede antwoorden (2 minuten).
  </p>


  <div class="smalltxt status" id="sheetStatus">

  </div>


  <div class="row">

  </div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbzFx3ki9rkHmZ7BxfP87RlbTKaegN34eHiBC24V_yBt4h6yyXRoAuA5gPiSyOrWtWh76w/exec";


/* =========================================================
   LEERLING + KLAS + CODE
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";

const STORAGE_DATA_PREFIX =
  "rekenen_data_v3_";


const studentId =
  (localStorage.getItem(STORAGE_CURRENT) || "").trim();

const studentClass =
  (localStorage.getItem(STORAGE_CLASS) || "").trim();

const studentCode =
  (localStorage.getItem(STORAGE_CODE) || "").trim();


if (
  !studentId ||
  !studentClass ||
  !studentCode
) {

  location.href =
    "index.html";
}


document.getElementById("who").textContent =
  `Leerling: ${studentId}`;

document.getElementById("whichClass").textContent =
  `Klas: ${studentClass}`;


/* =========================================================
   LOKALE BACK-UP
========================================================= */

function dataKey() {

  return STORAGE_DATA_PREFIX
    + studentClass
    + "__"
    + studentId;
}


function getLocalData() {

  const raw =
    localStorage.getItem(
      dataKey()
    );


  return raw
    ? JSON.parse(raw)
    : {
        v:1,
        id:studentId,
        klas:studentClass,
        levels:{
          plus:0,
          min:0,
          keer:0,
          deel:0
        }
      };
}


function setLocalData(d) {

  localStorage.setItem(
    dataKey(),
    JSON.stringify(d)
  );
}


/* =========================================================
   JSONP
========================================================= */

let __jsonpSeq =
  0;


function jsonp(url) {

  return new Promise(
    (resolve,reject) => {

      const cb =
        "__cb_"
        + (++__jsonpSeq)
        + "_"
        + Date.now();


      const script =
        document.createElement(
          "script"
        );


      const cleanup =
        () => {

          try {
            delete window[cb];
          } catch(e) {}

          script.remove();
        };


      window[cb] =
        data => {

          cleanup();

          resolve(data);
        };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              "JSONP failed"
            )
          );
        };


      const sep =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url
        + sep
        + "callback="
        + encodeURIComponent(cb);


      document.body.appendChild(
        script
      );
    }
  );
}


/* =========================================================
   NIVEAUS OPHALEN
========================================================= */

async function sheetsGet(
  klas,
  naam,
  code
) {

  const url =
    `${SHEETS_EXEC_URL}?action=get`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`;


  return await jsonp(url);
}


/* =========================================================
   AFGERONDE PLUS-RONDE OPSLAAN
========================================================= */

/*
  Geen niveau omhoog:

  played=1
  promoted=0
  game=plus

  → G wordt aangepast
  → I wordt aangepast


  Wel niveau omhoog:

  played=1
  promoted=1
  game=plus
  plus=nieuw niveau

  → C wordt aangepast
  → G wordt aangepast
  → H wordt aangepast
  → I wordt aangepast
*/

async function sheetsFinishPlus(
  klas,
  naam,
  code,
  promoted,
  plusLevel
) {

  let url =
    `${SHEETS_EXEC_URL}?action=set`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
    + `&played=1`
    + `&promoted=${promoted ? 1 : 0}`
    + `&game=plus`;


  /*
    Alleen het Plus-niveau meesturen
    als het niveau echt omhoog gaat.
  */

  if (promoted) {

    url +=
      `&plus=${encodeURIComponent(plusLevel)}`;
  }


  return await jsonp(url);
}


/* =========================================================
   INSTELLINGEN
========================================================= */

const THRESHOLD =
  24;

const SECONDS =
  120;

const DOTS =
  "...";


/* =========================================================
   NIVEAUS
========================================================= */

const LEVELS = [

  {
    name:
      "Niveau 1: optellen t/m 10"
  },

  {
    name:
      "Niveau 2: stipsommen t/m 10"
  },

  {
    name:
      "Niveau 3: tussen 10 en 20 (14 + 3)"
  },

  {
    name:
      "Niveau 4: stipsommen (vriendjes van 10)"
  },

  {
    name:
      "Niveau 5: t/m 20 met overschrijding (8 + 5)"
  },

  {
    name:
      "Niveau 6: stipsommen t/m 20"
  },

  {
    name:
      "Niveau 7: t/m 100 – tientallen (40 + 20)"
  },

  {
    name:
      "Niveau 8: tientallen bij tiental+eenheid (43 + 20)"
  },

  {
    name:
      "Niveau 9: eenheden zonder overschrijding (43 + 3)"
  },

  {
    name:
      "Niveau 10: eenheden met overschrijding (58 + 6)"
  },

  {
    name:
      "Niveau 11: tient+eenh zonder overschrijding (42 + 14)"
  },

  {
    name:
      "Niveau 12: tient+eenh met overschrijding (48 + 24)"
  }

];


/* =========================================================
   SCHERMELEMENTEN
========================================================= */

const timeEl =
  document.getElementById(
    "time"
  );

const goodEl =
  document.getElementById(
    "good"
  );

const triesEl =
  document.getElementById(
    "tries"
  );

const levelEl =
  document.getElementById(
    "level"
  );

const qEl =
  document.getElementById(
    "q"
  );

const ansEl =
  document.getElementById(
    "ans"
  );

const fbEl =
  document.getElementById(
    "fb"
  );

const resEl =
  document.getElementById(
    "res"
  );

const startBtn =
  document.getElementById(
    "start"
  );

const sheetStatusEl =
  document.getElementById(
    "sheetStatus"
  );


/* =========================================================
   SPELSTATUS
========================================================= */

let timer =
  null;

let t =
  SECONDS;

let good =
  0;

let tries =
  0;

let correct =
  0;

let active =
  false;

let sheetsOk =
  false;


let levels = {
  plus:0,
  min:0,
  keer:0,
  deel:0
};


/* =========================================================
   NIVEAU
========================================================= */

function clampLevel(n) {

  n =
    Number(n) || 0;


  return Math.min(
    Math.max(
      0,
      n
    ),
    LEVELS.length - 1
  );
}


/*
  Optellen kijkt alleen
  naar levels.plus.
*/

function getLevelIndex() {

  return clampLevel(
    levels.plus
  );
}


function renderLevel() {

  const i =
    getLevelIndex();


  levelEl.textContent =
    `Niveau: ${LEVELS[i].name}`;
}


/* =========================================================
   HULPFUNCTIES
========================================================= */

function fmt(s) {

  return Math.floor(
    s / 60
  )
  + ":"
  + String(
      s % 60
    ).padStart(
      2,
      "0"
    );
}


function r(
  min,
  max
) {

  return Math.floor(
    Math.random()
    * (max - min + 1)
  ) + min;
}


function tryLoop(
  makeFn,
  okFn
) {

  for (
    let k = 0;
    k < 300;
    k++
  ) {

    const v =
      makeFn();


    if (
      okFn(v)
    ) {

      return v;
    }
  }


  return makeFn();
}


/* =========================================================
   SOMMEN MAKEN
========================================================= */

function makeQuestionForLevel(level) {

  let a =
    0;

  let b =
    0;

  let target =
    0;

  let miss =
    0;


  /* =====================================================
     NIVEAU 1
     Optellen t/m 10
  ===================================================== */

  if (
    level === 0
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(0,10),
          b:r(0,10)
        }),

        x =>
          x.a + x.b <= 10
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 2
     Stipsommen t/m 10
  ===================================================== */

  if (
    level === 1
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(0,9),
          target:r(1,10)
        }),

        x =>
          x.target > x.a
      );


    a =
      p.a;

    target =
      p.target;

    miss =
      target - a;


    return {

      html:
        `${a} + ${DOTS} = ${target}`
        + `<br>`
        + `<small>Wat moet erbij?</small>`,

      answer:
        miss
    };
  }


  /* =====================================================
     NIVEAU 3
     Tussen 10 en 20
  ===================================================== */

  if (
    level === 2
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,19),
          b:r(1,10)
        }),

        x =>
          x.a + x.b >= 11
          &&
          x.a + x.b <= 20
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 4
     Vriendjes van 10
  ===================================================== */

  if (
    level === 3
  ) {

    a =
      r(1,9);


    miss =
      10 - a;


    return {

      html:
        `${a} + ${DOTS} = 10`
        + `<br>`
        + `<small>Vriendjes van 10</small>`,

      answer:
        miss
    };
  }


  /* =====================================================
     NIVEAU 5
     T/m 20 met overschrijding
  ===================================================== */

  if (
    level === 4
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(1,9),
          b:r(1,9)
        }),

        x =>
          x.a + x.b >= 11
          &&
          x.a + x.b <= 20
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 6
     Stipsommen t/m 20
  ===================================================== */

  if (
    level === 5
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(0,19),
          target:r(1,20)
        }),

        x =>
          x.target > x.a
      );


    a =
      p.a;

    target =
      p.target;

    miss =
      target - a;


    return {

      html:
        `${a} + ${DOTS} = ${target}`
        + `<br>`
        + `<small>Wat moet erbij?</small>`,

      answer:
        miss
    };
  }


  /* =====================================================
     NIVEAU 7
     Tientallen
  ===================================================== */

  if (
    level === 6
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(1,9) * 10,
          b:r(1,9) * 10
        }),

        x =>
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 8
     Tientallen bij tiental + eenheid
  ===================================================== */

  if (
    level === 7
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,99),
          b:r(1,9) * 10
        }),

        x =>
          x.a % 10 !== 0
          &&
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 9
     Eenheden zonder overschrijding
  ===================================================== */

  if (
    level === 8
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,99),
          b:r(1,9)
        }),

        x =>
          x.a % 10 !== 0
          &&
          (x.a % 10) + x.b <= 9
          &&
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 10
     Eenheden met overschrijding
  ===================================================== */

  if (
    level === 9
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,99),
          b:r(1,9)
        }),

        x =>
          x.a % 10 !== 0
          &&
          (x.a % 10) + x.b >= 10
          &&
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 11
     Tiental + eenheid zonder overschrijding
  ===================================================== */

  if (
    level === 10
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,99),
          b:r(10,99)
        }),

        x =>
          x.a % 10 !== 0
          &&
          x.b % 10 !== 0
          &&
          (x.a % 10) + (x.b % 10) <= 9
          &&
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }


  /* =====================================================
     NIVEAU 12
     Tiental + eenheid met overschrijding
  ===================================================== */

  if (
    level === 11
  ) {

    const p =
      tryLoop(

        () => ({
          a:r(10,99),
          b:r(10,99)
        }),

        x =>
          x.a % 10 !== 0
          &&
          x.b % 10 !== 0
          &&
          (x.a % 10) + (x.b % 10) >= 10
          &&
          x.a + x.b <= 100
      );


    a =
      p.a;

    b =
      p.b;


    return {

      html:
        `${a} + ${b} = ?`,

      answer:
        a + b
    };
  }
}


/* =========================================================
   NIEUWE SOM
========================================================= */

function newQ() {

  const q =
    makeQuestionForLevel(
      getLevelIndex()
    );


  correct =
    q.answer;


  qEl.innerHTML =
    q.html;


  ansEl.value =
    "";


  ansEl.focus();
}


/* =========================================================
   PLUS-NIVEAU LOKAAL OPSLAAN
========================================================= */

function saveLocalPlusLevel() {

  const d =
    getLocalData();


  d.levels =
    d.levels || {
      plus:0,
      min:0,
      keer:0,
      deel:0
    };


  d.levels.plus =
    levels.plus;


  setLocalData(d);
}


/* =========================================================
   AFGERONDE RONDE OPSLAAN
========================================================= */

async function saveFinishedRound(
  promoted
) {

  /*
    Als het niveau omhoog gaat,
    het nieuwe Plus-niveau
    ook lokaal bewaren.
  */

  if (
    promoted
  ) {

    saveLocalPlusLevel();
  }


  /*
    Iedere afgeronde ronde
    naar Google Sheets sturen.
  */

  if (
    sheetsOk
  ) {

    await sheetsFinishPlus(
      studentClass,
      studentId,
      studentCode,
      promoted,
      levels.plus
    );
  }
}


/* =========================================================
   START
========================================================= */

function start() {

  if (
    active
  ) {

    return;
  }


  active =
    true;


  good =
    0;

  tries =
    0;

  t =
    SECONDS;


  goodEl.textContent =
    "0";


  triesEl.textContent =
    "0";


  fbEl.textContent =
    "";


  fbEl.className =
    "feedback";


  resEl.textContent =
    "";


  ansEl.disabled =
    false;


  startBtn.disabled =
    true;


  renderLevel();


  newQ();


  timeEl.textContent =
    fmt(t);


  clearInterval(
    timer
  );


  timer =
    setInterval(
      () => {

        t--;


        timeEl.textContent =
          fmt(t);


        if (
          t <= 0
        ) {

          end();
        }

      },
      1000
    );
}


/* =========================================================
   EINDE VAN DE RONDE
========================================================= */

async function end() {

  /*
    Voorkomt dubbel uitvoeren.
  */

  if (
    !active
  ) {

    return;
  }


  clearInterval(
    timer
  );


  timer =
    null;


  active =
    false;


  ansEl.disabled =
    true;


  startBtn.disabled =
    false;


  const pct =
    Math.round(
      (good / tries) * 100
    ) || 0;


  const oldLevel =
    getLevelIndex();


  /*
    24 of meer goed:
    niveau omhoog als er nog
    een volgend niveau is.
  */

  const promoted =
    good >= THRESHOLD
    &&
    oldLevel < LEVELS.length - 1;


  /*
    Alleen Plus verhogen.
  */

  if (
    promoted
  ) {

    levels.plus =
      oldLevel + 1;


    renderLevel();
  }


  /*
    Iedere afgeronde ronde opslaan.
  */

  sheetStatusEl.textContent =
    sheetsOk
      ? "Sheets: spel opslaan…"
      : "Lokaal: opslaan…";


  try {

    await saveFinishedRound(
      promoted
    );


    sheetStatusEl.textContent =
      sheetsOk
        ? "Sheets: opgeslagen ✅"
        : "Lokaal: opgeslagen ✅";


  } catch(e) {

    sheetStatusEl.textContent =
      "Sheets: opslaan mislukt ⚠️";
  }


  let msg =
    `Je had ${good} goed van ${tries} pogingen. (${pct}%)`;


  if (
    promoted
  ) {

    msg +=
      " 🎉 Niveau omhoog!";

  } else {

    msg +=
      ` (Huidig niveau: ${LEVELS[oldLevel].name})`;
  }


  resEl.textContent =
    msg;


  renderLevel();
}


/* =========================================================
   ANTWOORD CONTROLEREN
========================================================= */

ansEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key !== "Enter"
      ||
      !active
    ) {

      return;
    }


    if (
      ansEl.value === ""
    ) {

      return;
    }


    tries++;


    triesEl.textContent =
      String(
        tries
      );


    if (
      Number(
        ansEl.value
      )
      ===
      correct
    ) {

      good++;


      goodEl.textContent =
        String(
          good
        );


      fbEl.textContent =
        "Goed!";


      fbEl.className =
        "feedback good";


    } else {

      fbEl.textContent =
        `Helaas, het was ${correct}.`;


      fbEl.className =
        "feedback bad";
    }


    newQ();
  }
);


/* =========================================================
   STARTKNOP
========================================================= */

startBtn.addEventListener(
  "click",
  start
);


/* =========================================================
   LOKALE VOORVERTONING
========================================================= */

(function initLocalPreview() {

  timeEl.textContent =
    fmt(
      SECONDS
    );


  const d =
    getLocalData();


  levels = {

    plus:
      Number(
        d.levels?.plus
      ) || 0,

    min:
      Number(
        d.levels?.min
      ) || 0,

    keer:
      Number(
        d.levels?.keer
      ) || 0,

    deel:
      Number(
        d.levels?.deel
      ) || 0
  };


  renderLevel();

})();


/* =========================================================
   GOOGLE SHEETS LADEN
========================================================= */

(async function initSheets() {

  startBtn.disabled =
    true;


  sheetStatusEl.textContent =
    "Sheets: laden…";


  try {

    const res =
      await sheetsGet(
        studentClass,
        studentId,
        studentCode
      );


    if (
      res
      &&
      res.ok === true
      &&
      res.levels
    ) {

      levels = {

        plus:
          Number(
            res.levels.plus
          ) || 0,

        min:
          Number(
            res.levels.min
          ) || 0,

        keer:
          Number(
            res.levels.keer
          ) || 0,

        deel:
          Number(
            res.levels.deel
          ) || 0
      };


      sheetsOk =
        true;


      sheetStatusEl.textContent =
        "Sheets: verbonden ✅";


      /*
        Geldige Sheet-data
        lokaal bewaren als back-up.
      */

      const local =
        getLocalData();


      local.levels = {
        ...local.levels,
        ...levels
      };


      setLocalData(
        local
      );


    } else {

      throw new Error(
        "Unexpected response"
      );
    }


  } catch(e) {

    sheetsOk =
      false;


    sheetStatusEl.textContent =
      "Kon niveau niet laden uit Sheets (lokale backup gebruikt).";
  }


  renderLevel();


  startBtn.disabled =
    false;

})();

</script>
