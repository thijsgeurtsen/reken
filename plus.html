<!DOCTYPE html>
<html lang="nl">
<head>

  <style>

  </style>
</head>

<body>

<div class="box">

  <div class="top">
    <a class="small" href="menu.html">← Menu</a>

    <div>
      <span class="pill" id="who">—</span>
      <span class="pill" id="whichClass">—</span>
    </div>
  </div>

  <h1>Optellen</h1>

  <p class="sub">
    Niveau omhoog bij
    <b>24 goed én minimaal 90%</b>
    in 2 minuten.
  </p>

  <div class="smalltxt" id="sheetStatus">
    Sheets: verbinden…
  </div>

  <div class="row">
    <div>⏱ <span id="time">2:00</span></div>
    <div>✅ <span id="good">0</span></div>
    <div>📊 <span id="tries">0</span></div>
  </div>

  <div class="pill" id="level">
    Niveau: laden…
  </div>

  <div class="q" id="q">
    Druk op start
  </div>

  <input
    id="ans"
    type="number"
    placeholder="antwoord"
    disabled
  >

  <div id="fb" class="feedback"></div>

  <div style="margin-top:1rem">
    <button id="start" disabled>
      Start 2-minutentest
    </button>
  </div>

  <div id="res" class="result"></div>

</div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SHEETS_EXEC_URL =
  "https://script.google.com/macros/s/AKfycbz-13F67vdmwulyOw5QVfO9AW25louOoFU6on6MlBvbSzxjzjuR8mbEwfTHzSZaSCeyvQ/exec";


/* =========================================================
   OPSLAG
========================================================= */

const STORAGE_CURRENT =
  "rekenen_current_student_v1";

const STORAGE_CLASS =
  "rekenen_current_class_v1";

const STORAGE_CODE =
  "rekenen_current_code_v1";

const STORAGE_DATA_PREFIX =
  "rekenen_data_v3_";


const studentId =
  (localStorage.getItem(STORAGE_CURRENT) || "").trim();

const studentClass =
  (localStorage.getItem(STORAGE_CLASS) || "").trim();

const studentCode =
  (localStorage.getItem(STORAGE_CODE) || "").trim();


if (
  !studentId ||
  !studentClass ||
  !studentCode
) {
  location.href = "index.html";
}


document.getElementById("who").textContent =
  `Leerling: ${studentId}`;

document.getElementById("whichClass").textContent =
  `Klas: ${studentClass}`;


/* =========================================================
   LOKALE BACK-UP
========================================================= */

function dataKey() {

  return STORAGE_DATA_PREFIX
    + studentClass
    + "__"
    + studentId;
}


function getLocalData() {

  const raw =
    localStorage.getItem(dataKey());

  return raw
    ? JSON.parse(raw)
    : {
        levels: {
          plus: 0,
          min: 0,
          keer: 0,
          deel: 0
        }
      };
}


function setLocalData(d) {

  localStorage.setItem(
    dataKey(),
    JSON.stringify(d)
  );
}


/* =========================================================
   JSONP
========================================================= */

let jsonpSeq = 0;


function jsonp(url) {

  return new Promise((resolve, reject) => {

    const cb =
      "__cb_"
      + (++jsonpSeq)
      + "_"
      + Date.now();


    const script =
      document.createElement("script");


    const cleanup = () => {

      try {
        delete window[cb];
      } catch(e) {}

      script.remove();
    };


    window[cb] = data => {

      cleanup();
      resolve(data);
    };


    script.onerror = () => {

      cleanup();

      reject(
        new Error("JSONP failed")
      );
    };


    const sep =
      url.includes("?")
        ? "&"
        : "?";


    script.src =
      url
      + sep
      + "callback="
      + encodeURIComponent(cb);


    document.body.appendChild(script);
  });
}


/* =========================================================
   SHEETS OPHALEN
========================================================= */

async function sheetsGet(
  klas,
  naam,
  code
) {

  return await jsonp(
    `${SHEETS_EXEC_URL}?action=get`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
  );
}


/* =========================================================
   PLUS-RONDE OPSLAAN
========================================================= */

async function sheetsFinishPlus(
  klas,
  naam,
  code,
  promoted,
  mastered,
  plusLevel
) {

  let url =
    `${SHEETS_EXEC_URL}?action=set`
    + `&klas=${encodeURIComponent(klas)}`
    + `&naam=${encodeURIComponent(naam)}`
    + `&code=${encodeURIComponent(code)}`
    + `&played=1`
    + `&promoted=${promoted ? 1 : 0}`
    + `&mastered=${mastered ? 1 : 0}`
    + `&game=plus`;


  /*
    Alleen een nieuw niveau meesturen
    wanneer er echt promotie is.
  */

  if (promoted) {

    url +=
      `&plus=${encodeURIComponent(plusLevel)}`;
  }


  return await jsonp(url);
}


/* =========================================================
   INSTELLINGEN
========================================================= */

const MIN_GOED =
  24;

const MIN_PERCENTAGE =
  90;

const FOUT_WACHTTIJD_MS =
  700;

/*
  Na 4 fouten achter elkaar
  stopt de ronde.
*/

const MAX_FOUTEN_OP_RIJ =
  4;

const SECONDS =
  120;

const DOTS =
  "...";


/* =========================================================
   NIVEAUS
========================================================= */

const LEVELS = [

  {name:"Niveau 1: optellen t/m 10"},

  {name:"Niveau 2: stipsommen t/m 10"},

  {name:"Niveau 3: tussen 10 en 20 (14 + 3)"},

  {name:"Niveau 4: stipsommen (vriendjes van 10)"},

  {name:"Niveau 5: t/m 20 met overschrijding (8 + 5)"},

  {name:"Niveau 6: stipsommen t/m 20"},

  {name:"Niveau 7: t/m 100 – tientallen (40 + 20)"},

  {name:"Niveau 8: tientallen bij tiental+eenheid (43 + 20)"},

  {name:"Niveau 9: eenheden zonder overschrijding (43 + 3)"},

  {name:"Niveau 10: eenheden met overschrijding (58 + 6)"},

  {name:"Niveau 11: tient+eenh zonder overschrijding (42 + 14)"},

  {name:"Niveau 12: tient+eenh met overschrijding (48 + 24)"}

];


/* =========================================================
   ELEMENTEN
========================================================= */

const timeEl =
  document.getElementById("time");

const goodEl =
  document.getElementById("good");

const triesEl =
  document.getElementById("tries");

const levelEl =
  document.getElementById("level");

const qEl =
  document.getElementById("q");

const ansEl =
  document.getElementById("ans");

const fbEl =
  document.getElementById("fb");

const resEl =
  document.getElementById("res");

const startBtn =
  document.getElementById("start");

const sheetStatusEl =
  document.getElementById("sheetStatus");


/* =========================================================
   SPELSTATUS
========================================================= */

let timer =
  null;

let foutTimer =
  null;

let t =
  SECONDS;

let good =
  0;

let tries =
  0;

let correct =
  0;

let active =
  false;

let antwoordGeblokkeerd =
  false;

let foutenOpRij =
  0;

let sheetsOk =
  false;


let levels = {
  plus: 0,
  min: 0,
  keer: 0,
  deel: 0
};


/* =========================================================
   NIVEAU
========================================================= */

function clampLevel(n) {

  return Math.min(
    Math.max(
      0,
      Number(n) || 0
    ),
    LEVELS.length - 1
  );
}


function getLevelIndex() {

  return clampLevel(
    levels.plus
  );
}


function renderLevel() {

  const i =
    getLevelIndex();

  levelEl.textContent =
    `Niveau: ${LEVELS[i].name}`;
}


/* =========================================================
   HULPFUNCTIES
========================================================= */

function fmt(s) {

  return Math.floor(s / 60)
    + ":"
    + String(
        s % 60
      ).padStart(
        2,
        "0"
      );
}


function r(
  min,
  max
) {

  return Math.floor(
    Math.random()
    * (max - min + 1)
  ) + min;
}


function tryLoop(
  makeFn,
  okFn
) {

  for (
    let k = 0;
    k < 300;
    k++
  ) {

    const v =
      makeFn();


    if (
      okFn(v)
    ) {

      return v;
    }
  }


  return makeFn();
}


/* =========================================================
   SOMMEN MAKEN
========================================================= */

function makeQuestionForLevel(level) {

  let a = 0;


  /* Niveau 1 */

  if (level === 0) {

    const p =
      tryLoop(
        () => ({
          a: r(0,10),
          b: r(0,10)
        }),
        x =>
          x.a + x.b <= 10
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 2 */

  if (level === 1) {

    const p =
      tryLoop(
        () => ({
          a: r(0,9),
          target: r(1,10)
        }),
        x =>
          x.target > x.a
      );

    return {
      html:
        `${p.a} + ${DOTS} = ${p.target}`
        + `<br><small>Wat moet erbij?</small>`,
      answer: p.target - p.a
    };
  }


  /* Niveau 3 */

  if (level === 2) {

    const p =
      tryLoop(
        () => ({
          a: r(10,19),
          b: r(1,10)
        }),
        x =>
          x.a + x.b >= 11
          &&
          x.a + x.b <= 20
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 4 */

  if (level === 3) {

    a =
      r(1,9);

    return {
      html:
        `${a} + ${DOTS} = 10`
        + `<br><small>Vriendjes van 10</small>`,
      answer: 10 - a
    };
  }


  /* Niveau 5 */

  if (level === 4) {

    const p =
      tryLoop(
        () => ({
          a: r(1,9),
          b: r(1,9)
        }),
        x =>
          x.a + x.b >= 11
          &&
          x.a + x.b <= 20
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 6 */

  if (level === 5) {

    const p =
      tryLoop(
        () => ({
          a: r(0,19),
          target: r(1,20)
        }),
        x =>
          x.target > x.a
      );

    return {
      html:
        `${p.a} + ${DOTS} = ${p.target}`
        + `<br><small>Wat moet erbij?</small>`,
      answer: p.target - p.a
    };
  }


  /* Niveau 7 */

  if (level === 6) {

    const p =
      tryLoop(
        () => ({
          a: r(1,9) * 10,
          b: r(1,9) * 10
        }),
        x =>
          x.a + x.b <= 100
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 8 */

  if (level === 7) {

    const p =
      tryLoop(
        () => ({
          a: r(10,99),
          b: r(1,9) * 10
        }),
        x =>
          x.a % 10 !== 0
          &&
          x.a + x.b <= 100
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 9 */

  if (level === 8) {

    const p =
      tryLoop(
        () => ({
          a: r(10,99),
          b: r(1,9)
        }),
        x =>
          x.a % 10 !== 0
          &&
          (x.a % 10) + x.b <= 9
          &&
          x.a + x.b <= 100
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 10 */

  if (level === 9) {

    const p =
      tryLoop(
        () => ({
          a: r(10,99),
          b: r(1,9)
        }),
        x =>
          x.a % 10 !== 0
          &&
          (x.a % 10) + x.b >= 10
          &&
          x.a + x.b <= 100
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 11 */

  if (level === 10) {

    const p =
      tryLoop(
        () => ({
          a: r(10,99),
          b: r(10,99)
        }),
        x =>
          x.a % 10 !== 0
          &&
          x.b % 10 !== 0
          &&
          (x.a % 10) + (x.b % 10) <= 9
          &&
          x.a + x.b <= 100
      );

    return {
      html: `${p.a} + ${p.b} = ?`,
      answer: p.a + p.b
    };
  }


  /* Niveau 12 */

  const p =
    tryLoop(
      () => ({
        a: r(10,99),
        b: r(10,99)
      }),
      x =>
        x.a % 10 !== 0
        &&
        x.b % 10 !== 0
        &&
        (x.a % 10) + (x.b % 10) >= 10
        &&
        x.a + x.b <= 100
    );


  return {
    html: `${p.a} + ${p.b} = ?`,
    answer: p.a + p.b
  };
}


/* =========================================================
   NIEUWE SOM
========================================================= */

function newQ() {

  if (!active) {
    return;
  }


  const q =
    makeQuestionForLevel(
      getLevelIndex()
    );


  correct =
    q.answer;


  qEl.innerHTML =
    q.html;


  ansEl.value =
    "";


  ansEl.disabled =
    false;


  antwoordGeblokkeerd =
    false;


  ansEl.focus();
}


/* =========================================================
   LOKAAL NIVEAU OPSLAAN
========================================================= */

function saveLocalPlusLevel() {

  const d =
    getLocalData();


  d.levels =
    d.levels || {
      plus: 0,
      min: 0,
      keer: 0,
      deel: 0
    };


  d.levels.plus =
    levels.plus;


  setLocalData(d);
}


/* =========================================================
   VOLLEDIGE RONDE OPSLAAN
========================================================= */

async function saveFinishedRound(
  promoted,
  mastered
) {

  /*
    Alleen bij promotie verandert het niveau.
  */

  if (promoted) {

    saveLocalPlusLevel();
  }


  if (sheetsOk) {

    await sheetsFinishPlus(
      studentClass,
      studentId,
      studentCode,
      promoted,
      mastered,
      levels.plus
    );
  }
}


/* =========================================================
   START
========================================================= */

function start() {

  if (active) {
    return;
  }


  clearTimeout(
    foutTimer
  );


  active =
    true;

  antwoordGeblokkeerd =
    false;

  foutenOpRij =
    0;

  good =
    0;

  tries =
    0;

  t =
    SECONDS;


  goodEl.textContent =
    "0";

  triesEl.textContent =
    "0";

  fbEl.textContent =
    "";

  fbEl.className =
    "feedback";

  resEl.textContent =
    "";


  ansEl.disabled =
    false;

  startBtn.disabled =
    true;


  renderLevel();

  newQ();


  timeEl.textContent =
    fmt(t);


  clearInterval(
    timer
  );


  timer =
    setInterval(
      () => {

        t--;


        timeEl.textContent =
          fmt(t);


        if (t <= 0) {

          end(
            "tijd"
          );
        }

      },
      1000
    );
}


/* =========================================================
   EINDE
========================================================= */

async function end(
  reden = "tijd"
) {

  if (!active) {
    return;
  }


  active =
    false;


  clearInterval(
    timer
  );

  timer =
    null;


  clearTimeout(
    foutTimer
  );

  foutTimer =
    null;


  antwoordGeblokkeerd =
    true;

  ansEl.disabled =
    true;

  startBtn.disabled =
    true;


  const percentage =
    tries > 0
      ? Math.round(
          (good / tries) * 100
        )
      : 0;


  const oldLevel =
    getLevelIndex();


  /*
    Alleen een volledig uitgespeelde ronde
    kan leiden tot promotie of afronding.
  */

  const voldoetAanEisen =
    reden === "tijd"
    &&
    good >= MIN_GOED
    &&
    percentage >= MIN_PERCENTAGE;


  /*
    Normale promotie:
    leerling zit nog niet op het hoogste niveau.
  */

  const promoted =
    voldoetAanEisen
    &&
    oldLevel < LEVELS.length - 1;


  /*
    Hoogste niveau afgerond:
    leerling stond al op niveau 12
    en voldoet opnieuw aan 24 goed + 90%.
  */

  const mastered =
    voldoetAanEisen
    &&
    oldLevel === LEVELS.length - 1;


  if (promoted) {

    levels.plus =
      oldLevel + 1;
  }


  /*
    Alleen een VOLLEDIG uitgespeelde ronde
    wordt naar Sheets gestuurd.

    Een ronde die vanwege 4 fouten stopt,
    wordt dus helemaal niet opgeslagen.
  */

  if (
    reden === "tijd"
  ) {

    sheetStatusEl.textContent =
      sheetsOk
        ? "Sheets: spel opslaan…"
        : "Lokaal: opslaan…";


    try {

      await saveFinishedRound(
        promoted,
        mastered
      );


      sheetStatusEl.textContent =
        sheetsOk
          ? "Sheets: opgeslagen ✅"
          : "Lokaal: opgeslagen ✅";


    } catch(e) {

      sheetStatusEl.textContent =
        "Sheets: opslaan mislukt ⚠️";
    }

  } else {

    sheetStatusEl.textContent =
      "Ronde afgebroken – niet opgeslagen";
  }


  let tekst =
    `${good} goed van ${tries} pogingen. `
    + `${percentage}% goed.`;


  if (
    reden === "teveel_fouten"
  ) {

    tekst +=
      ` Ronde gestopt: ${MAX_FOUTEN_OP_RIJ} fouten achter elkaar. `
      + `Deze ronde is niet opgeslagen.`;

  } else if (
    mastered
  ) {

    tekst +=
      " 🏆 Gefeliciteerd! Je hebt het hoogste niveau van Optellen behaald!";

  } else if (
    promoted
  ) {

    tekst +=
      " 🎉 Niveau omhoog!";

  } else if (
    good >= MIN_GOED
    &&
    percentage < MIN_PERCENTAGE
  ) {

    tekst +=
      ` Je was snel genoeg, maar voor niveau omhoog is minimaal ${MIN_PERCENTAGE}% goed nodig.`;

  } else if (
    good < MIN_GOED
    &&
    percentage >= MIN_PERCENTAGE
  ) {

    tekst +=
      ` Je werkte nauwkeurig. Voor niveau omhoog zijn minimaal ${MIN_GOED} goede antwoorden nodig.`;

  } else {

    tekst +=
      ` Voor niveau omhoog heb je minimaal ${MIN_GOED} goed én ${MIN_PERCENTAGE}% nodig.`;
  }


  resEl.textContent =
    tekst;


  renderLevel();


  startBtn.disabled =
    false;
}


/* =========================================================
   ANTWOORD CONTROLEREN
========================================================= */

ansEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key !== "Enter"
      ||
      !active
      ||
      antwoordGeblokkeerd
      ||
      ansEl.value === ""
    ) {

      return;
    }


    tries++;


    triesEl.textContent =
      String(
        tries
      );


    const antwoord =
      Number(
        ansEl.value
      );


    /* =====================================================
       GOED
    ===================================================== */

    if (
      antwoord === correct
    ) {

      good++;


      foutenOpRij =
        0;


      goodEl.textContent =
        String(
          good
        );


      fbEl.textContent =
        "Goed!";


      fbEl.className =
        "feedback good";


      newQ();


      return;
    }


    /* =====================================================
       FOUT
    ===================================================== */

    foutenOpRij++;


    antwoordGeblokkeerd =
      true;


    ansEl.disabled =
      true;


    fbEl.textContent =
      `Helaas, het was ${correct}.`;


    fbEl.className =
      "feedback bad";


    /*
      Na 5 fouten achter elkaar:
      ronde stoppen.
    */

    if (
      foutenOpRij >=
      MAX_FOUTEN_OP_RIJ
    ) {

      foutTimer =
        setTimeout(
          () => {

            end(
              "teveel_fouten"
            );

          },
          FOUT_WACHTTIJD_MS
        );


      return;
    }


    /*
      Anders na 0,7 seconde verder.
    */

    foutTimer =
      setTimeout(
        () => {

          if (!active) {
            return;
          }


          newQ();

        },
        FOUT_WACHTTIJD_MS
      );
  }
);


/* =========================================================
   STARTKNOP
========================================================= */

startBtn.addEventListener(
  "click",
  start
);


/* =========================================================
   LOKALE DATA LADEN
========================================================= */

(function initLocal() {

  timeEl.textContent =
    fmt(
      SECONDS
    );


  const d =
    getLocalData();


  levels = {
    plus: Number(d.levels?.plus) || 0,
    min: Number(d.levels?.min) || 0,
    keer: Number(d.levels?.keer) || 0,
    deel: Number(d.levels?.deel) || 0
  };


  renderLevel();

})();


/* =========================================================
   GOOGLE SHEETS LADEN
========================================================= */

(async function initSheets() {

  startBtn.disabled =
    true;


  sheetStatusEl.textContent =
    "Sheets: laden…";


  try {

    const res =
      await sheetsGet(
        studentClass,
        studentId,
        studentCode
      );


    if (
      !res
      ||
      res.ok !== true
      ||
      !res.levels
    ) {

      throw new Error(
        "Ongeldig antwoord"
      );
    }


    levels = {
      plus: Number(res.levels.plus) || 0,
      min: Number(res.levels.min) || 0,
      keer: Number(res.levels.keer) || 0,
      deel: Number(res.levels.deel) || 0
    };


    sheetsOk =
      true;


    sheetStatusEl.textContent =
      "Sheets: verbonden ✅";


    const d =
      getLocalData();


    d.levels = {
      ...d.levels,
      ...levels
    };


    setLocalData(d);


  } catch(e) {

    sheetsOk =
      false;


    sheetStatusEl.textContent =
      "Kon niveau niet laden uit Sheets.";
  }


  renderLevel();


  startBtn.disabled =
    false;

})();

</script>
